    file: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
    copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.9 4.9l1.4 1.4"/><path d="M17.7 17.7l1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.9 19.1l1.4-1.4"/><path d="M17.7 6.3l1.4-1.4"/>',
    moon: '<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',
    clipboard: '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 13l2 2 4-4"/>',
    more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'
  };
  function ico(name, cls) {
    return '<svg class="ico' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + (ICONS[name] || '') + '</svg>';
  }

  /* ---------- Helper umum ---------- */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  /** Escape HTML — dipakai untuk SEMUA data dari sheet yang disisipkan ke innerHTML / atribut. */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  /** Hanya izinkan tautan http(s). */
  function safeUrl(u) {
    const s = String(u || '').trim();
    return /^https?:\/\//i.test(s) ? s : '';
  }
  function errMsg(e) { return (e && e.message) ? e.message : String(e); }

  function formatDate(val) {
    if (!val) return '-';
    const d = new Date(val);
    if (isNaN(d)) return String(val);
    return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  /** Tanggal lokal (bukan UTC) — versi lama memakai toISOString() sehingga dini hari WIB terbaca "kemarin". */
  function todayISO() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function daysSince(v) {
    if (!v) return null;
    const d = new Date(v);
    if (isNaN(d)) return null;
    const t = new Date();
    const a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const b = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    return Math.max(0, Math.round((b - a) / 864e5));
  }
  function debounce(fn, ms) {
    let t = null;
    return function () { const a = arguments; clearTimeout(t); t = setTimeout(() => fn.apply(null, a), ms); };
  }

  const store = {
    get(k) { try { return localStorage.getItem('difa:' + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem('difa:' + k, v); } catch (e) { /* abaikan */ } }
  };

  /* ============================================================
   *  PEMBUNGKUS API (menggantikan pemanggilan langsung Apps Script)
   *  Semua panggilan: POST text/plain ke Apps Script (/exec) membawa
   *  { fn, args, sesi }. Tanpa sesi sah, server menolak.
   * ============================================================ */
  const API_URL = window.DIFA_API_URL;
  let sesi = null;
  try { sesi = localStorage.getItem('difa:sesi'); } catch (e) { /* abaikan */ }
  let loginPromise = null;

  function simpanSesi(v) {
    sesi = v;
    try { v ? localStorage.setItem('difa:sesi', v) : localStorage.removeItem('difa:sesi'); } catch (e) { /* abaikan */ }
  }

  function kirimApi(fn, args, token) {
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // "simple request": tanpa preflight CORS
      body: JSON.stringify({ fn: fn, args: args, sesi: token || null }),
      redirect: 'follow'
    }).then(r => r.json().catch(() => { throw new Error('Respons server tidak dikenali.'); }));
  }

  function tampilLogin() {
    return new Promise(resolve => {
      const ov = document.createElement('div');
      ov.id = 'loginOverlay';
      ov.setAttribute('role', 'dialog');
      ov.setAttribute('aria-modal', 'true');
      ov.setAttribute('aria-label', 'Masuk admin');
      ov.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg,#0f172a);';
      ov.innerHTML =
        '<form id="loginForm" style="width:100%;max-width:360px;background:var(--surface,#fff);color:var(--text,#0f172a);border:1px solid var(--border,#e2e8f0);border-radius:var(--r-lg,16px);padding:28px 24px;box-shadow:var(--shadow-float,0 10px 30px rgba(0,0,0,.2));">' +
        '<div style="font-family:var(--font-head,inherit);font-size:22px;font-weight:700;">DiFA</div>' +
        '<p style="margin:4px 0 20px;color:var(--text-2,#475569);font-size:14px;">Masuk sebagai admin untuk mengelola surat.</p>' +
        '<label for="loginPw" style="display:block;font-size:13px;margin-bottom:6px;">Password admin</label>' +
        '<input id="loginPw" type="password" autocomplete="current-password" required style="width:100%;box-sizing:border-box;height:44px;padding:0 12px;font-size:16px;border:1px solid var(--border-strong,#cbd5e1);border-radius:var(--r-sm,8px);background:var(--surface-2,#fff);color:inherit;">' +
        '<div id="loginErr" role="alert" style="min-height:20px;margin:8px 0 4px;font-size:13px;color:var(--danger,#dc2626);"></div>' +
        '<button id="loginBtn" type="submit" style="width:100%;height:44px;border:0;border-radius:var(--r-sm,8px);background:var(--brand,#0ea5e9);color:var(--on-brand,#fff);font-size:15px;font-weight:600;cursor:pointer;">Masuk</button>' +
        '</form>';
      document.body.appendChild(ov);
      const form = ov.querySelector('#loginForm'), pw = ov.querySelector('#loginPw'), err = ov.querySelector('#loginErr'), btn = ov.querySelector('#loginBtn');
      pw.focus();
      form.addEventListener('submit', ev => {
        ev.preventDefault();
        err.textContent = '';
        btn.disabled = true; btn.textContent = 'Memeriksa...';
        kirimApi('login', [pw.value], null).then(res => {
          if (res && res.ok) { simpanSesi(res.data.sesi); ov.remove(); resolve(); return; }
          err.textContent = (res && res.error) || 'Gagal masuk.';
          pw.value = ''; pw.focus();
        }).catch(() => {
          err.textContent = 'Tidak dapat menghubungi server. Periksa koneksi lalu coba lagi.';
        }).then(() => { btn.disabled = false; btn.textContent = 'Masuk'; });
      });
    });
  }

  function pastikanSesi() {
    if (sesi) return Promise.resolve();
    if (!loginPromise) loginPromise = tampilLogin().then(() => { loginPromise = null; });
    return loginPromise;
  }

  function panggil(name, args, sudahUlang) {
    return kirimApi(name, args, sesi).then(res => {
      if (res && res.ok) return res.data;
      if (res && res.kode === 'SESI' && !sudahUlang) {
        simpanSesi(null);
        return pastikanSesi().then(() => panggil(name, args, true));
      }
      throw new Error((res && res.error) || 'Permintaan gagal.');
    });
  }

  /** Pembungkus panggilan server berbasis Promise (antarmuka sama seperti sebelumnya). */
  function gs(name) {
    const args = Array.prototype.slice.call(arguments, 1);
    return pastikanSesi().then(() => panggil(name, args, false));
  }

  function keluarAdmin() {
    const t = sesi;
    simpanSesi(null);
    (t ? kirimApi('logout', [], t) : Promise.resolve()).catch(() => {}).then(() => location.reload());
  }
  document.addEventListener('click', e => {
    if (e.target.closest && e.target.closest('[data-act="logout"]')) keluarAdmin();
  });

  function readFileBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(',')[1]);
      reader.onerror = () => reject(new Error('File tidak bisa dibaca.'));
      reader.readAsDataURL(file);
    });
  }

  function copyText(text) {
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return ok;
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(() => true, () => fallback());
    }
    return Promise.resolve(fallback());
  }

  /* ---------- Paginasi ---------- */
  const PAGE_SIZES = [10, 25, 50, 100];
  function ukuranHalamanAwal() {
    const n = Number(store.get('pagesize'));
    return PAGE_SIZES.indexOf(n) > -1 ? n : 25;
  }
  function pageNumbers(p, n) {
    const set = new Set([1, n, p - 1, p, p + 1]);
    if (p <= 3) { set.add(2); set.add(3); }
    if (p >= n - 2) { set.add(n - 1); set.add(n - 2); }
    const arr = Array.from(set).filter(x => x >= 1 && x <= n).sort((a, b) => a - b);
    const out = [];
    arr.forEach((x, i) => { if (i && x - arr[i - 1] > 1) out.push('gap'); out.push(x); });
    return out;
  }
  /** Kontrol halaman di bawah tabel. Tidak ditampilkan bila seluruh daftar muat dalam satu halaman terkecil. */
  function pagerHTML(kind, total, page, size) {
    if (total <= PAGE_SIZES[0]) return '';
    const n = Math.max(1, Math.ceil(total / size));
    const dari = (page - 1) * size + 1, ke = Math.min(total, page * size);
    const btn = (p, label, cls, dis, attrs) =>
      '<button type="button" class="pg' + cls + '" data-act="page-go" data-kind="' + kind + '" data-page="' + p + '"' + (dis ? ' disabled' : '') + (attrs || '') + '>' + label + '</button>';
    const nums = pageNumbers(page, n).map(x => x === 'gap'
      ? '<span class="pg-gap" aria-hidden="true">&hellip;</span>'
      : btn(x, x, ' pg-num' + (x === page ? ' on' : ''), false, x === page ? ' aria-current="page"' : ' aria-label="Halaman ' + x + '"')).join('');
    return '<nav class="pager" aria-label="Navigasi halaman daftar">' +
      '<div class="pager-info">Menampilkan ' + dari + '&ndash;' + ke + ' dari ' + total + ' surat' + (n > 1 ? ' &middot; Halaman ' + page + ' dari ' + n : '') + '</div>' +
      (n > 1 ? '<div class="pager-ctl">' + btn(page - 1, 'Sebelumnya', '', page <= 1, ' aria-label="Halaman sebelumnya"') + nums + btn(page + 1, 'Berikutnya', '', page >= n, ' aria-label="Halaman berikutnya"') + '</div>' : '') +
      '<label class="pager-size">Per halaman <select class="select-sm" data-change="page-size" data-kind="' + kind + '" aria-label="Jumlah surat per halaman">' +
      PAGE_SIZES.map(z => '<option value="' + z + '"' + (z === size ? ' selected' : '') + '>' + z + '</option>').join('') + '</select></label></nav>';
  }
  /** Membawa pandangan ke awal daftar setelah pindah halaman (tab di atas tabel). */
  function keAwalDaftar(kind) {
    const t = $(kind === 'masuk' ? '#masukTabs' : '#keluarTabs');
    if (t && t.scrollIntoView) t.scrollIntoView({ block: 'start' });
  }

  /* ---------- State ---------- */
  const S = {
    page: 'dashboard', nav: 0,
    masuk: { rows: [], tahun: null, tahunTersedia: [], tab: 'aktif', q: '', fetchedAt: 0, page: 1, size: ukuranHalamanAwal() },
    keluar: { rows: [], tahun: null, tahunTersedia: [], tab: 'semua', q: '', fetchedAt: 0, page: 1, size: ukuranHalamanAwal() },
    lap: { tab: 'masuk', data: null },
    master: { tab: 'pejabat', pejabat: [], klasifikasi: [] },
    masterCache: { pejabat: null, klasifikasi: null },
    pejabatList: [],
    riwayat: {}, searchIdx: null,
    detail: null, sheetKind: null, lastFocus: null,
    charts: {}, toastSeq: 0, toastActions: {},
    dialogResolve: null, lembarHtml: '', prevTok: 0
  };
  const REG = { masuk: {}, keluar: {} };

  /* ---------- Cache data master (sisi klien) ---------- */
  function preloadMasterData() {
    gs('getMasterDataGabungan').then(d => {
      S.masterCache.pejabat = d.pejabat;
      S.masterCache.klasifikasi = d.klasifikasi;
    }).catch(() => { /* diam: akan dicoba lagi saat form dibuka */ });
  }
  async function getPejabatCached() {
    if (!S.masterCache.pejabat) S.masterCache.pejabat = await gs('getMasterPejabat');
    return S.masterCache.pejabat;
  }
  async function getKlasifikasiCached() {
    if (!S.masterCache.klasifikasi) S.masterCache.klasifikasi = await gs('getMasterKlasifikasi');
    return S.masterCache.klasifikasi;
  }
  function invalidateMasterClientCache(jenis) {
    if (jenis === 'pejabat') S.masterCache.pejabat = null;
    else if (jenis === 'klasifikasi') S.masterCache.klasifikasi = null;
    else { S.masterCache.pejabat = null; S.masterCache.klasifikasi = null; }
  }
  /** Dipanggil setiap kali data surat/disposisi berubah. */
  function dataChanged() { S.riwayat = {}; S.searchIdx = null; }

  /* ============================================================
   *  KOMPONEN UI: toast, dialog, drawer (sheet)
   * ============================================================ */
  function toast(msg, o) {
    o = o || {};
    const id = ++S.toastSeq;
    const type = o.type || 'info';
    const iconName = type === 'ok' ? 'checkc' : type === 'err' ? 'xc' : type === 'warn' ? 'alert' : 'info';
    const el = document.createElement('div');
    el.className = 'toast t-' + type;
    el.setAttribute('role', type === 'err' ? 'alert' : 'status');
    el.dataset.id = id;
    el.innerHTML =
      '<span class="toast-ico">' + ico(iconName) + '</span>' +
      '<div class="toast-msg">' + esc(msg) + '</div>' +
      (o.actionLabel ? '<button type="button" class="toast-action" data-act="toast-action" data-id="' + id + '">' + esc(o.actionLabel) + '</button>' : '') +
      '<button type="button" class="toast-x" data-act="toast-close" aria-label="Tutup notifikasi">' + ico('x') + '</button>';
    if (o.onAction) S.toastActions[id] = o.onAction;
    $('#toasts').appendChild(el);
    const ms = o.duration != null ? o.duration : (type === 'err' ? 10000 : (o.actionLabel ? 12000 : 5000));
    if (ms) setTimeout(() => removeToast(el), ms);
  }
  function removeToast(el) {
    if (!el || !el.parentNode) return;
    delete S.toastActions[el.dataset.id];
    el.classList.add('leaving');
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 180);
  }

  function openDialog(html, wide) {
    $('#dialogRoot').innerHTML =
      '<div class="overlay overlay-center" data-act="dialog-backdrop">' +
      '<div class="dialog' + (wide ? ' dialog-wide' : '') + '" role="dialog" aria-modal="true" tabindex="-1">' + html + '</div></div>';
    document.body.classList.add('no-scroll');
    const d = $('#dialogRoot .dialog');
    const btn = $('[data-autofocus]', d);
    (btn || d).focus({ preventScroll: true });
  }
  function closeDialog(result) {
    $('#dialogRoot').innerHTML = '';
    if (!$('#sheetRoot').firstElementChild) document.body.classList.remove('no-scroll');
    if (S.dialogResolve) { const r = S.dialogResolve; S.dialogResolve = null; r(!!result); }
  }
  function confirmDialog(o) {
    return new Promise(resolve => {
      S.dialogResolve = resolve;
      openDialog(
        '<div class="dialog-body"><h2 class="dialog-title">' + esc(o.title) + '</h2>' +
        '<p class="dialog-msg">' + esc(o.message || '') + '</p></div>' +
        '<div class="dialog-foot">' +
        '<button type="button" class="btn btn-secondary" data-act="dialog-no">' + esc(o.cancelLabel || 'Batal') + '</button>' +
        '<button type="button" class="btn ' + (o.danger ? 'btn-danger' : 'btn-primary') + '" data-act="dialog-yes" data-autofocus>' + esc(o.confirmLabel || 'Ya, lanjutkan') + '</button>' +
        '</div>'
      );
    });
  }

  /** Drawer samping untuk detail & form. Jika sudah terbuka, isinya diganti tanpa animasi ulang. */
  function openSheet(o) {
    const root = $('#sheetRoot');
    const head =
      '<div class="sheet-head"><div class="sheet-headtext"><h2 class="sheet-title" id="sheetTitle">' + esc(o.title) + '</h2>' +
      (o.sub ? '<div class="sheet-sub">' + o.sub + '</div>' : '') + '</div>' +
      '<button type="button" class="btn-icon" data-act="close-sheet" aria-label="Tutup panel">' + ico('x') + '</button></div>';
    const html = head + '<div class="sheet-body" id="sheetBody">' + o.body + '</div>' + (o.foot ? '<div class="sheet-foot" id="sheetFoot">' + o.foot + '</div>' : '');
    const existing = root.querySelector('.sheet');
    if (existing) {
      existing.innerHTML = html;
    } else {
      S.lastFocus = document.activeElement;
      root.innerHTML = '<div class="overlay overlay-side" data-act="sheet-backdrop"><aside class="sheet' + (o.wide ? ' sheet-wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">' + html + '</aside></div>';
      document.body.classList.add('no-scroll');
      const sh = $('.sheet', root);
      const af = $('[data-autofocus]', sh);
      (af || sh).focus({ preventScroll: true });
    }
    S.sheetKind = o.kind || null;
  }
  function closeSheet() {
    const root = $('#sheetRoot');
    if (!root.firstElementChild) return;
    root.innerHTML = '';
    S.sheetKind = null; S.detail = null;
    if (!$('#dialogRoot').firstElementChild) document.body.classList.remove('no-scroll');
    const lf = S.lastFocus;
    S.lastFocus = null;
    if (lf && lf.focus && document.body.contains(lf)) { try { lf.focus({ preventScroll: true }); } catch (e) { /* abaikan */ } }
  }

  /* ---------- Bantuan form ---------- */
  function clearErrs(root) {
    $$('.field .err', root || document).forEach(e => { e.textContent = ''; });
    $$('[aria-invalid="true"]', root || document).forEach(e => e.removeAttribute('aria-invalid'));
  }
  /** Menampilkan galat di bawah kolom; mengembalikan elemen kontrolnya supaya bisa difokuskan. */
  function fieldErr(name, msg) {
    const wrap = $('.field[data-field="' + name + '"]');
    if (!wrap) return null;
    const e = $('.err', wrap);
    if (e) e.textContent = msg;
    const ctl = $('input, select, textarea', wrap);
    if (ctl) ctl.setAttribute('aria-invalid', 'true');
    return ctl;
  }
  function setBusy(btn, busy, label) {
    if (!btn) return;
    if (busy) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin" aria-hidden="true"></span> ' + esc(label || 'Memproses…'); }
    else { btn.disabled = false; if (btn.dataset.label != null) btn.innerHTML = btn.dataset.label; }
  }
  function optionsHTML(list, selected) {
    return list.map(o => '<option' + (o === selected ? ' selected' : '') + '>' + esc(o) + '</option>').join('');
  }

  /* ---------- Lencana & penanda ---------- */
  function statusBadge(status) {
    const s = (status || 'Baru').toString();
    let cls = 'b-warn';
    if (s === 'Didisposisikan') cls = 'b-info';
    else if (s === 'Selesai' || s === 'Closed' || s === 'Diterbitkan') cls = 'b-ok';
    else if (s === 'Konsep') cls = 'b-muted';
    return '<span class="badge ' + cls + '">' + esc(s) + '</span>';
  }
  function hopBadge(status) {
    const s = (status || '-').toString();
    let cls = 'b-muted';
    if (s === 'Selesai') cls = 'b-ok';
    else if (s.indexOf('Diteruskan ke') === 0) cls = 'b-info';
    else if (s.indexOf('Manual') > -1 || s.indexOf('Menunggu') === 0) cls = 'b-warn';
    return '<span class="badge ' + cls + '">' + esc(s) + '</span>';
  }
  const isSelesai = r => r['Status'] === 'Selesai' || r['Status'] === 'Closed';
  const isManual = r => String(r['Status Diteruskan'] || '').indexOf('Manual') > -1;
  const pemegangOf = r => r['Pemegang Saat Ini'] || r['Pimpinan Tujuan'] || '-';

  function ageChip(r) {
    if (isSelesai(r)) return '';
    const n = daysSince(r['Diterima Tanggal']);
    if (n === null) return '';
    const cls = n >= OVERDUE_DAYS ? 'late' : n >= STALE_DAYS ? 'stale' : 'ok';
    const txt = n === 0 ? 'Hari ini' : n + ' hari';
    return '<span class="age age-' + cls + '" title="Menunggu ' + n + ' hari sejak diterima">' + ico('clock') + txt + '</span>';
  }

  function registerMasuk(rows) { (rows || []).forEach(r => { if (r['Kode Tracking']) REG.masuk[r['Kode Tracking']] = r; }); }
  function registerKeluar(rows) { (rows || []).forEach(r => { if (r['Nomor Surat Lengkap']) REG.keluar[r['Nomor Surat Lengkap']] = r; }); }
  function setMasukData(res) {
    S.masuk.rows = res.rows; S.masuk.tahun = res.tahunDipilih; S.masuk.tahunTersedia = res.tahunTersedia; S.masuk.fetchedAt = Date.now();
    registerMasuk(res.rows);
    updateDisposisiBadge();
  }
  function setKeluarData(res) {
    S.keluar.rows = res.rows; S.keluar.tahun = res.tahunDipilih; S.keluar.tahunTersedia = res.tahunTersedia; S.keluar.fetchedAt = Date.now();
    registerKeluar(res.rows);
  }
  function yearSelect(list, selected, act) {
    return '<select class="select-sm" data-change="' + act + '" aria-label="Tahun">' +
      list.map(t => '<option value="' + esc(t) + '"' + (Number(t) === Number(selected) ? ' selected' : '') + '>' + esc(t) + '</option>').join('') + '</select>';
  }
  function skeleton() {
    return '<div class="skel-wrap" aria-hidden="true"><div class="skel-row"><div class="skel s-4"></div><div class="skel s-4"></div><div class="skel s-4"></div><div class="skel s-4"></div></div>' +
      '<div class="skel s-block"></div><div class="skel s-line"></div><div class="skel s-line"></div><div class="skel s-line short"></div></div>';
  }
  function emptyState(iconName, title, text, actionHTML) {
    return '<div class="empty">' + ico(iconName) + '<h3>' + esc(title) + '</h3>' + (text ? '<p>' + esc(text) + '</p>' : '') + (actionHTML || '') + '</div>';
  }
  function showError(err) {
    $('#content').innerHTML =
      '<div class="empty empty-err">' + ico('alert') + '<h3>Data belum bisa dimuat</h3><p>' + esc(errMsg(err)) + '</p>' +
      '<p class="sub">Jika sheet belum dibuat, jalankan <b>initializeSheets()</b> dari editor Apps Script.</p>' +
      '<button type="button" class="btn btn-secondary" data-act="retry">Coba lagi</button></div>';
  }

  /* ============================================================
   *  TEMA (terang / gelap)
   * ============================================================ */
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    const meta = $('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#0a101c' : '#0f172a');
    $$('[data-theme-ico]').forEach(el => { el.innerHTML = ico(t === 'dark' ? 'sun' : 'moon'); });
    $$('[data-theme-label]').forEach(el => { el.textContent = t === 'dark' ? 'Tema terang' : 'Tema gelap'; });
  }
  function initTheme() {
    const saved = store.get('theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(saved || (prefersDark ? 'dark' : 'light'));
  }
  function toggleTheme() {
    const now = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    store.set('theme', now);
    applyTheme(now);
    // gambar ulang grafik dengan warna tema baru, tanpa mereset filter laporan
    if (S.page === 'dashboard') navigateTo('dashboard', { soft: true });
    else if (S.page === 'laporan' && S.lap.data && $('#laporanHasil')) renderLaporanHasil();
  }
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  /* ============================================================
   *  CANGKANG APLIKASI: sidebar, navigasi, pencarian global
   * ============================================================ */
  /** Menandai item bottom navigation yang aktif. "Disposisi" = daftar surat yang masih dalam alur (tab Perlu tindakan / Teruskan manual). */
  function bnavKey() {
    if (S.page === 'dashboard') return 'dashboard';
    if (S.page === 'masuk') return (S.masuk.tab === 'aktif' || S.masuk.tab === 'manual') ? 'disposisi' : 'masuk';
    if (S.page === 'keluar') return 'keluar';
    return 'lainnya';
  }
  function syncBnav() {
    const k = bnavKey();
    $$('.bnav-item').forEach(b => {
      const on = b.dataset.bnav === k;
      b.classList.toggle('active', on);
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }
  function updateDisposisiBadge() {
    const el = $('#bnavBadge');
    if (!el || S.masuk.tahun !== new Date().getFullYear()) return;
    const n = S.masuk.rows.filter(r => !isSelesai(r)).length;
    el.textContent = n > 99 ? '99+' : String(n);
    el.hidden = n === 0;
  }
  function openMoreMenu() {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    const item = (act, page, icon, title, sub) =>
      '<button type="button" class="more-item" data-act="' + act + '"' + (page ? ' data-page="' + page + '"' : '') + '>' + ico(icon) + '<span>' + title + '<small>' + sub + '</small></span></button>';
    openDialog(
      '<div class="dialog-body"><h2 class="dialog-title">Menu lainnya</h2><div class="more-list">' +
      item('nav-close', 'laporan', 'chart', 'Laporan', 'Rekap surat per periode dan klasifikasi') +
      item('nav-close', 'arsip', 'archive', 'Arsip &amp; Backup', 'Backup tahunan dan pengarsipan') +
      item('nav-close', 'master', 'sliders', 'Data Master', 'Pejabat, klasifikasi, uji WhatsApp') +
      item('theme-close', '', dark ? 'sun' : 'moon', dark ? 'Tema terang' : 'Tema gelap', 'Ubah tampilan aplikasi') +
      '</div></div><div class="dialog-foot"><button type="button" class="btn btn-secondary" data-act="close-dialog" data-autofocus>Tutup</button></div>');
  }

  async function navigateTo(page, opts) {
    opts = opts || {};
    page = PAGE_ALIAS[page] || page;
    if (!PAGE_META[page]) page = 'dashboard';
    if (!opts.soft) { closeSheet(); window.scrollTo(0, 0); }
    S.page = page;
    syncBnav();
    const token = ++S.nav;
    $$('[data-page]').forEach(b => {
      const on = b.dataset.page === page;
      b.classList.toggle('active', on);
      if (b.classList.contains('nav-item')) { if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); }
    });
    const meta = PAGE_META[page];
    $('#pageTitle').textContent = meta.title;
    $('#pageSubtitle').textContent = meta.sub;
    if (!opts.soft) $('#content').innerHTML = skeleton();
    try {
      await PAGES[page](token, opts);
    } catch (err) {
      if (token === S.nav) showError(err);
    }
  }
  const stale = token => token !== S.nav;

  /* ---------- Pencarian global (Ctrl+K atau /) ---------- */
  function ensureSearchIndex() {
    if (S.searchIdx) return S.searchIdx;
    const p = Promise.all([gs('getSuratMasukList'), gs('getSuratKeluarList')]).then(r => {
      registerMasuk(r[0].rows); registerKeluar(r[1].rows);
      return { tahun: r[0].tahunDipilih, masuk: r[0].rows, keluar: r[1].rows };
    });
    S.searchIdx = p;
    p.catch(() => { if (S.searchIdx === p) S.searchIdx = null; });
    return p;
  }
  async function runSearch(raw) {
    const pop = $('#searchPop');
    const term = raw.trim().toLowerCase();
    if (term.length < 2) { pop.hidden = true; pop.innerHTML = ''; return; }
    pop.hidden = false;
    pop.innerHTML = '<div class="sp-empty">Mencari…</div>';
    let idx;
    try { idx = await ensureSearchIndex(); }
    catch (e) { pop.innerHTML = '<div class="sp-empty">Pencarian gagal: ' + esc(errMsg(e)) + '</div>'; return; }
    if ($('#globalSearch').value.trim().toLowerCase() !== term) return;

    const hit = (r, fields) => fields.some(f => String(r[f] == null ? '' : r[f]).toLowerCase().indexOf(term) > -1);
    const m = idx.masuk.filter(r => hit(r, ['No. Agenda', 'Nomor Naskah Dinas', 'Dari', 'Hal', 'Kode Tracking', 'Pimpinan Tujuan'])).slice(0, 6);
    const k = idx.keluar.filter(r => hit(r, ['Nomor Surat Lengkap', 'Perihal', 'Tujuan'])).slice(0, 6);

    let html = '';
    if (m.length) {
      html += '<div class="sp-group">Surat masuk</div>' + m.map(r =>
        '<button type="button" class="sp-item" data-act="search-pick" data-type="masuk" data-key="' + esc(r['Kode Tracking']) + '">' +
        '<span class="sp-main">' + esc(r['Hal'] || '(Tanpa perihal)') + '</span>' +
        '<span class="sp-sub">' + esc(r['Dari'] || '-') + ', ' + esc(r['No. Agenda'] || '-') + '</span></button>').join('');
    }
    if (k.length) {
      html += '<div class="sp-group">Surat keluar</div>' + k.map(r =>
        '<button type="button" class="sp-item" data-act="search-pick" data-type="keluar" data-key="' + esc(r['Nomor Surat Lengkap']) + '">' +
        '<span class="sp-main">' + esc(r['Perihal'] || '(Tanpa perihal)') + '</span>' +
        '<span class="sp-sub mono">' + esc(r['Nomor Surat Lengkap']) + '</span></button>').join('');
    }
    if (!html) html = '<div class="sp-empty">Tidak ada surat yang cocok di tahun ' + esc(idx.tahun) + '.</div>';
    else html += '<div class="sp-foot">Mencari di surat tahun ' + esc(idx.tahun) + '. Ganti tahun di halaman daftar untuk arsip lama.</div>';
    pop.innerHTML = html;
  }
  function closeSearch(clear) {
    const pop = $('#searchPop');
    if (pop) { pop.hidden = true; pop.innerHTML = ''; }
    if (clear) { const i = $('#globalSearch'); if (i) i.value = ''; }
  }

  /* ============================================================
   *  HALAMAN
   * ============================================================ */
  const PAGES = {};
  const byDiterimaAsc = (a, b) => new Date(a['Diterima Tanggal']) - new Date(b['Diterima Tanggal']);

  /* ---------- Grafik ---------- */
  function chartReady() {
    if (typeof Chart === 'undefined') return false;
    Chart.defaults.color = cssVar('--text-2');
    Chart.defaults.borderColor = cssVar('--border');
    Chart.defaults.font.family = "'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif";
    Chart.defaults.font.size = 12;
    return true;
  }
  function destroyChart(k) { if (S.charts[k]) { S.charts[k].destroy(); S.charts[k] = null; } }
  function chartPalette() { return [1, 2, 3, 4, 5, 6].map(i => cssVar('--c' + i)); }
  function chartUnavailable(canvasId) {
    const c = $('#' + canvasId);
    if (c && c.parentElement) c.parentElement.innerHTML = '<p class="sub">Grafik tidak bisa dimuat (pustaka Chart.js tidak tersedia). Data tetap bisa dibaca di tabel.</p>';
  }

  /* ============================================================
   *  BERANDA — antrean kerja
   * ============================================================ */
  function kpi(o) {
    return '<button type="button" class="kpi' + (o.tone ? ' kpi-' + o.tone : '') + '" data-act="goto" data-page="' + o.page + '" data-tab="' + (o.tab || '') + '">' +
      '<span class="kpi-label">' + esc(o.label) + '</span>' +
      '<span class="kpi-value">' + esc(o.value) + '</span>' +
      '<span class="kpi-sub">' + esc(o.sub) + '</span></button>';
  }

  PAGES.dashboard = async function (token) {
    const res = await gs('getBerandaData');   // statistik + daftar surat masuk dalam SATU panggilan
    if (stale(token)) return;
    const stats = res.stats;
    setMasukData(res.masuk);

    const aktif = S.masuk.rows.filter(r => !isSelesai(r));
    const manual = aktif.filter(isManual);
    const lambat = aktif.filter(r => { const n = daysSince(r['Diterima Tanggal']); return n !== null && n >= OVERDUE_DAYS; });
    const queue = aktif.slice().sort(byDiterimaAsc).slice(0, 8);
    const thn = S.masuk.tahun;

    const queueHTML = queue.length
      ? '<ul class="queue">' + queue.map(r => {
        const kode = r['Kode Tracking'];
        return '<li class="q-item" data-act="open-masuk" data-kode="' + esc(kode) + '">' +
          '<div class="q-main">' +
          '<button type="button" class="link-title" data-act="open-masuk" data-kode="' + esc(kode) + '">' + esc(r['Hal'] || '(Tanpa perihal)') + '</button>' +
          '<div class="sub">Dari ' + esc(r['Dari'] || '-') + ', diterima ' + formatDate(r['Diterima Tanggal']) + '</div></div>' +
          '<div class="q-holder" title="Pemegang saat ini">' + ico('user') + '<span>' + esc(pemegangOf(r)) + '</span></div>' +
          '<div class="q-age">' + ageChip(r) + (isManual(r) ? '<span class="badge b-danger">Teruskan manual</span>' : '') + '</div>' +
          '<button type="button" class="btn btn-secondary btn-sm" data-act="open-masuk" data-kode="' + esc(kode) + '" data-mode="lanjut">Lanjutkan</button>' +
          '</li>';
      }).join('') + '</ul>'
      : emptyState('checkc', 'Semua surat sudah ditindaklanjuti', 'Tidak ada surat masuk tahun ' + thn + ' yang menunggu tindakan.',
        '<button type="button" class="btn btn-primary" data-act="add-masuk">' + ico('plus') + 'Catat surat masuk</button>');

    $('#content').innerHTML =
      '<section class="kpi-grid" aria-label="Ringkasan">' +
      kpi({ page: 'masuk', tab: 'aktif', tone: 'brand', label: 'Perlu tindakan', value: aktif.length, sub: 'Surat masuk ' + thn + ' yang belum selesai' }) +
      kpi({ page: 'masuk', tab: 'manual', tone: manual.length ? 'danger' : '', label: 'Perlu diteruskan manual', value: manual.length, sub: 'Notifikasi otomatis tidak sampai' }) +
      kpi({ page: 'masuk', tab: 'aktif', tone: lambat.length ? 'warn' : '', label: 'Menunggu ' + OVERDUE_DAYS + ' hari atau lebih', value: lambat.length, sub: 'Surat aktif yang mengendap' }) +
      kpi({ page: 'masuk', tab: 'semua', label: 'Masuk bulan ini', value: stats.totalMasukBulanIni, sub: 'Semua status' }) +
      kpi({ page: 'keluar', tab: 'semua', label: 'Keluar bulan ini', value: stats.totalKeluarBulanIni, sub: 'Termasuk konsep' }) +
      '</section>' +
      '<section class="card card-flush"><div class="card-head"><div><h2 class="card-title">Perlu tindakan</h2>' +
      '<p class="sub">Terlama di atas. Klik surat untuk melihat riwayat dan meneruskan disposisi.</p></div>' +
      (aktif.length > queue.length ? '<button type="button" class="btn btn-ghost btn-sm" data-act="goto" data-page="masuk" data-tab="aktif">Lihat semua ' + aktif.length + '</button>' : '') +
      '</div>' + queueHTML + '</section>' +
      '<section class="grid-2">' +
      '<div class="card"><h2 class="card-title">Tren surat 6 bulan</h2><div class="chart-box"><canvas id="trendChart" role="img" aria-label="Grafik tren surat masuk dan keluar enam bulan terakhir"></canvas></div></div>' +
      '<div class="card"><h2 class="card-title">Klasifikasi arsip</h2><p class="sub">Seluruh surat, per kode induk</p><div class="chart-box"><canvas id="klasChart" role="img" aria-label="Grafik distribusi klasifikasi arsip"></canvas></div></div>' +
      '</section>';

    if (!chartReady()) { chartUnavailable('trendChart'); chartUnavailable('klasChart'); return; }
    destroyChart('trend'); destroyChart('klas');
    const t = stats.trend, pal = chartPalette();
    S.charts.trend = new Chart($('#trendChart'), {
      type: 'line',
      data: { labels: t.labels, datasets: [
        { label: 'Surat masuk', data: t.masukCounts, borderColor: pal[0], backgroundColor: pal[0] + '22', tension: 0.3, fill: true, pointRadius: 3 },
        { label: 'Surat keluar', data: t.keluarCounts, borderColor: pal[1], backgroundColor: pal[1] + '22', tension: 0.3, fill: true, pointRadius: 3 }
      ] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10 } } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
    });
    const labels = Object.keys(stats.klasifikasi || {});
    if (!labels.length) { $('#klasChart').parentElement.innerHTML = '<p class="sub">Belum ada data klasifikasi.</p>'; return; }
    S.charts.klas = new Chart($('#klasChart'), {
      type: 'doughnut',
      data: { labels: labels, datasets: [{ data: labels.map(k => stats.klasifikasi[k]), backgroundColor: labels.map((_, i) => pal[i % pal.length]), borderWidth: 2, borderColor: cssVar('--surface') }] },
      options: { responsive: true, maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 10 } } } }
    });
  };

  /* ============================================================
   *  SURAT MASUK — daftar gabungan dengan disposisi
   * ============================================================ */
  /** Stale-while-revalidate: bila data sudah ada di memori, langsung tampil (tanpa skeleton); ke server hanya bila sudah > FRESH_MS. */
  PAGES.masuk = async function (token) {
    const m = S.masuk;
    if (m.fetchedAt) {
      renderMasukPage();
      if (Date.now() - m.fetchedAt < FRESH_MS) return;
    }
    const res = await gs('getSuratMasukList', m.tahun || undefined);
    if (stale(token)) return;
    setMasukData(res);
    renderMasukPage();
  };

  function renderMasukPage() {
    const m = S.masuk;
    $('#content').innerHTML =
      '<div class="toolbar"><div class="toolbar-l">' +
      yearSelect(m.tahunTersedia, m.tahun, 'year-masuk') +
      '<div class="filter-box">' + ico('search') + '<input type="search" id="qMasuk" data-input="q-masuk" value="' + esc(m.q) + '" placeholder="Filter daftar ini" aria-label="Filter daftar surat masuk" autocomplete="off"></div>' +
      '</div><button type="button" class="btn btn-primary" data-act="add-masuk">' + ico('plus') + 'Surat masuk</button></div>' +
      '<div class="tabs" role="tablist" id="masukTabs"></div>' +
      '<div class="card card-flush" id="masukList"></div>';
    renderMasukList();
  }

  function masukFilterFn(tab) {
    if (tab === 'aktif') return r => !isSelesai(r);
    if (tab === 'manual') return r => !isSelesai(r) && isManual(r);
    if (tab === 'selesai') return r => isSelesai(r);
    return () => true;
  }

  function renderMasukList() {
    const m = S.masuk;
    const tabs = [['aktif', 'Perlu tindakan'], ['manual', 'Teruskan manual'], ['selesai', 'Selesai'], ['semua', 'Semua']];
    $('#masukTabs').innerHTML = tabs.map(t => {
      const n = m.rows.filter(masukFilterFn(t[0])).length;
      return '<button type="button" role="tab" class="tab' + (m.tab === t[0] ? ' on' : '') + '" aria-selected="' + (m.tab === t[0]) + '" data-act="tab-masuk" data-tab="' + t[0] + '">' + t[1] + '<span class="count">' + n + '</span></button>';
    }).join('');

    const q = m.q.trim().toLowerCase();
    let rows = m.rows.filter(masukFilterFn(m.tab));
    if (q) {
      const f = ['No. Agenda', 'Nomor Naskah Dinas', 'Dari', 'Hal', 'Kode Tracking', 'Pimpinan Tujuan', 'Pemegang Saat Ini'];
      rows = rows.filter(r => f.some(k => String(r[k] == null ? '' : r[k]).toLowerCase().indexOf(q) > -1));
    }
    if (m.tab === 'aktif' || m.tab === 'manual') rows = rows.slice().sort(byDiterimaAsc);

    const box = $('#masukList');
    if (!rows.length) {
      const msg = q ? 'Tidak ada surat yang cocok dengan "' + m.q + '".' :
        m.tab === 'selesai' ? 'Belum ada surat selesai di tahun ' + m.tahun + '.' :
        m.tab === 'manual' ? 'Tidak ada surat yang perlu diteruskan manual.' :
        m.tab === 'aktif' ? 'Tidak ada surat yang menunggu tindakan.' : 'Belum ada surat masuk di tahun ' + m.tahun + '.';
      box.innerHTML = emptyState('inbox', msg, '', m.tab === 'semua' && !q ? '<button type="button" class="btn btn-primary" data-act="add-masuk">' + ico('plus') + 'Catat surat masuk</button>' : '');
      return;
    }
    const total = rows.length, nHal = Math.max(1, Math.ceil(total / m.size));
    if (m.page > nHal) m.page = nHal;
    if (m.page < 1) m.page = 1;
    const pageRows = rows.slice((m.page - 1) * m.size, m.page * m.size);
    const note = (m.tab === 'aktif' || m.tab === 'manual') ? '<p class="list-note">Diurutkan dari yang paling lama menunggu.</p>' : '';
    box.innerHTML = note +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>No. Agenda</th><th>Surat</th><th>Diterima</th><th>Pemegang saat ini</th><th>Status</th><th><span class="sr-only">Aksi</span></th></tr></thead><tbody>' +
      pageRows.map(masukRow).join('') + '</tbody></table></div>' + pagerHTML('masuk', total, m.page, m.size);
  }

  function masukRow(r) {
    const kode = r['Kode Tracking'];
    const selesai = isSelesai(r);
    const url = safeUrl(r['Lampiran (URL)']);
    const lamp = url ? ' <a class="inline-ico" href="' + esc(url) + '" target="_blank" rel="noopener" title="Buka lampiran PDF" aria-label="Buka lampiran PDF">' + ico('clip') + '</a>' : '';
    const teruskan = r['Status Diteruskan'] ? '<div class="sub">' + esc(r['Status Diteruskan']) + '</div>' : '';
    return '<tr class="row-click" data-act="open-masuk" data-kode="' + esc(kode) + '">' +
      '<td data-label="No. Agenda"><span class="mono">' + esc(r['No. Agenda'] || '-') + '</span></td>' +
      '<td data-label="Surat" class="cell-main"><button type="button" class="link-title" data-act="open-masuk" data-kode="' + esc(kode) + '">' + esc(r['Hal'] || '(Tanpa perihal)') + '</button>' + lamp +
      '<div class="sub">Dari ' + esc(r['Dari'] || '-') + '</div></td>' +
      '<td data-label="Diterima">' + formatDate(r['Diterima Tanggal']) + (selesai ? '' : ' ' + ageChip(r)) + '</td>' +
      '<td data-label="Pemegang">' + esc(pemegangOf(r)) + '</td>' +
      '<td data-label="Status">' + statusBadge(r['Status']) + (isManual(r) && !selesai ? ' <span class="badge b-danger">Teruskan manual</span>' : '') + teruskan + '</td>' +
      '<td data-label="" class="cell-actions">' +
      (selesai ? '' :
        '<button type="button" class="btn btn-secondary btn-sm" data-act="open-masuk" data-kode="' + esc(kode) + '" data-mode="lanjut">Lanjutkan</button>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-act="selesai" data-kode="' + esc(kode) + '">Selesai</button>') +
      '<button type="button" class="btn-icon" data-act="cetak" data-kode="' + esc(kode) + '" aria-label="Cetak lembar disposisi" title="Cetak lembar disposisi">' + ico('printer') + '</button>' +
      '</td></tr>';
  }

  /* ============================================================
   *  DRAWER DETAIL SURAT MASUK + RIWAYAT + LANJUTKAN DISPOSISI
   * ============================================================ */
  function kv(label, valueHTML) { return '<div class="kv-row"><dt>' + esc(label) + '</dt><dd>' + valueHTML + '</dd></div>'; }

  /** Riwayat satu surat, di-cache per kode di memori client (dibuang oleh dataChanged()). */
  function getRiwayat(kode) {
    if (!S.riwayat[kode]) {
      const p = gs('getRiwayatDisposisi', kode);
      S.riwayat[kode] = p;
      p.catch(() => { if (S.riwayat[kode] === p) delete S.riwayat[kode]; });
    }
    return S.riwayat[kode];
  }

  function timelineHTML(hops) {
    return '<ol class="timeline">' + hops.map((h, i) => {
      const last = i === hops.length - 1;
      const awal = h['Pimpinan'] === LABEL_INPUT_ADMIN_JS;
      const lines = [];
      const pet = h['Petunjuk Disposisi'];
      if (!awal && pet && pet !== '-') lines.push('<div class="tl-line"><span>Petunjuk</span>' + esc(pet) + '</div>');
      const tuju = h['Diteruskan Kepada'];
      if (tuju && tuju !== '-') lines.push('<div class="tl-line"><span>' + (awal ? 'Ditujukan kepada' : 'Diteruskan kepada') + '</span>' + esc(tuju) + '</div>');
      if (h['Catatan']) lines.push('<div class="tl-line"><span>Catatan</span>' + esc(h['Catatan']) + '</div>');
      return '<li class="tl-item' + (last ? ' is-current' : '') + '"><span class="tl-dot" aria-hidden="true"></span><div class="tl-body">' +
        '<div class="tl-head"><b>' + (awal ? 'Surat dicatat admin' : esc(h['Pimpinan'] || '-')) + '</b><time>' + formatDate(h['Tanggal Disposisi']) + '</time></div>' +
        lines.join('') + '<div class="tl-status">' + hopBadge(h['Status Tindak Lanjut']) + '</div></div></li>';
    }).join('') + '</ol>';
  }

  async function loadTimeline(kode) {
    const box = $('#timelineBox');
    if (!box) return;
    try {
      const hops = await getRiwayat(kode);                 // sudah kronologis dari server
      if (!S.detail || S.detail.kode !== kode) return;
      const target = $('#timelineBox');
      if (!target) return;
      target.innerHTML = hops.length ? timelineHTML(hops) : '<p class="sub">Belum ada riwayat disposisi.</p>';
    } catch (e) {
      const target = $('#timelineBox');
      if (target) target.innerHTML = '<p class="sub">Riwayat belum bisa dimuat: ' + esc(errMsg(e)) + '</p>';
    }
  }

  function openMasukDrawer(r, mode) {
    if (!r) return;
    const kode = r['Kode Tracking'];
    const selesai = isSelesai(r);
    const url = safeUrl(r['Lampiran (URL)']);
    S.detail = { kode: kode };

    const body =
      '<div class="detail-status">' + statusBadge(r['Status']) + (isManual(r) && !selesai ? '<span class="badge b-danger">Teruskan manual</span>' : '') + ageChip(r) + '</div>' +
      '<dl class="kv">' +
      kv('Dari', esc(r['Dari'] || '-')) +
      kv('Nomor naskah dinas', '<span class="mono">' + esc(r['Nomor Naskah Dinas'] || '-') + '</span>') +
      kv('Tanggal naskah', formatDate(r['Tanggal Naskah Dinas'])) +
      kv('Jenis dan sifat', esc((r['Jenis'] || '-') + ', ' + (r['Sifat'] || '-'))) +
      kv('Index', esc(r['Index'] || '-')) +
      kv('Klasifikasi', esc(r['Kode Klasifikasi'] || '-')) +
      kv('Diterima', formatDate(r['Diterima Tanggal'])) +
      kv('Nomor agenda', '<span class="mono">' + esc(r['No. Agenda'] || '-') + '</span>') +
      kv('Ditujukan awal kepada', esc(r['Pimpinan Tujuan'] || '-')) +
      kv('Dipegang sekarang', '<b class="holder">' + ico('user') + esc(pemegangOf(r)) + '</b>') +
      kv('Lampiran', url ? '<a class="attach" href="' + esc(url) + '" target="_blank" rel="noopener">' + ico('clip') + 'Buka PDF</a>' : 'Tidak ada') +
      '</dl>' +
      '<h3 class="section-title">Riwayat disposisi</h3>' +
      '<div id="timelineBox"><div class="skel s-line"></div><div class="skel s-line short"></div></div>' +
      (selesai ? '<div class="banner banner-ok">' + ico('checkc') + '<span>Surat ini sudah selesai dan tidak menerima disposisi lanjutan.</span></div>' :
        '<section class="inline-form" id="lanjutBox" hidden>' +
        '<h3 class="section-title">Catat disposisi</h3>' +
        '<p class="hint">Dicatat sebagai tindakan dari <b>' + esc(pemegangOf(r)) + '</b>. Pakai ini bila disposisi disampaikan langsung atau lewat telepon, bukan lewat email.</p>' +
        '<div class="prev-box" id="l_prev" hidden></div>' +
        '<div class="field" data-field="petunjuk"><label for="l_petunjuk">Petunjuk disposisi <small id="l_petunjukOpsional" hidden>boleh dikosongkan bila memilih Selesai</small></label>' +
        '<select id="l_petunjuk"><option value="">Pilih petunjuk…</option>' + PETUNJUK_OFFICIAL_JS.map(o => '<option value="' + esc(o) + '">' + esc(o) + '</option>').join('') + '</select><div class="err" role="alert"></div></div>' +
        '<div class="field"><span class="label">Diteruskan kepada <small>boleh lebih dari satu, kosongkan bila ini langkah akhir, atau pilih Selesai</small></span><div class="checks" id="l_checks"><p class="sub">Memuat daftar jabatan…</p></div></div>' +
        '<div class="field"><label for="l_catatan">Catatan</label><textarea id="l_catatan" rows="3" placeholder="Opsional"></textarea></div>' +
        '<div class="banner banner-err" id="l_msg" hidden></div>' +
        '<div class="inline-actions"><button type="button" class="btn btn-ghost" data-act="lanjut-cancel">Batal</button>' +
        '<button type="button" class="btn btn-primary" id="btnLanjutkan" data-act="submit-lanjut" data-kode="' + esc(kode) + '">Catat disposisi</button></div>' +
        '</section>');

    const foot =
      '<button type="button" class="btn btn-secondary" data-act="cetak" data-kode="' + esc(kode) + '">' + ico('printer') + 'Cetak lembar</button>' +
      (selesai ? '' :
        '<button type="button" class="btn btn-secondary" data-act="selesai" data-kode="' + esc(kode) + '">' + ico('check') + 'Tandai selesai</button>' +
        '<button type="button" class="btn btn-primary" data-act="lanjut-toggle">' + ico('arrow') + 'Lanjutkan disposisi</button>');

    openSheet({ kind: 'detail', title: r['Hal'] || '(Tanpa perihal)', sub: '<span class="mono">' + esc(kode) + '</span>', body: body, foot: foot });
    loadTimeline(kode);
    if (mode === 'lanjut' && !selesai) showLanjut();
  }

  /** Menampilkan disposisi sebelumnya (petunjuk terakhir + catatan tiap jabatan) tepat di atas kolom isian. */
  async function fillPrevBox(kode) {
    if (!kode || !$('#l_prev')) return;
    try {
      const hops = await getRiwayat(kode);
      const box = $('#l_prev');
      if (!box || !S.detail || S.detail.kode !== kode) return;
      const aksi = hops.filter(h => h['Pimpinan'] !== LABEL_INPUT_ADMIN_JS);
      if (!aksi.length) {
        box.innerHTML = '<div class="prev-title">Disposisi sebelumnya</div><div>Belum ada. Surat baru dicatat admin dan ditujukan kepada <b>' + esc((hops[0] && hops[0]['Diteruskan Kepada']) || '-') + '</b>.</div>';
        box.hidden = false;
        return;
      }
      // baris hasil fan-out (satu tindakan ke beberapa tujuan) digabung agar catatan tidak berulang
      const gabung = [], seen = {};
      aksi.forEach(h => {
        const k = [h['Pimpinan'], h['Tanggal Disposisi'], h['Petunjuk Disposisi'], h['Catatan']].join('|');
        const tuju = h['Diteruskan Kepada'] && h['Diteruskan Kepada'] !== '-' ? h['Diteruskan Kepada'] : '';
        if (seen[k] !== undefined) { if (tuju) gabung[seen[k]].tuju.push(tuju); return; }
        seen[k] = gabung.length;
        gabung.push({ dari: h['Pimpinan'], tgl: h['Tanggal Disposisi'], pet: h['Petunjuk Disposisi'], cat: h['Catatan'], tuju: tuju ? [tuju] : [] });
      });
      const last = gabung[gabung.length - 1];
      const catatan = gabung.filter(g => g.cat).slice(-3);
      box.innerHTML =
        '<div class="prev-title">Disposisi sebelumnya</div>' +
        '<div><b>' + esc(last.dari) + '</b> (' + formatDate(last.tgl) + ')' +
        (last.pet && last.pet !== '-' ? ': ' + esc(last.pet) : '') +
        (last.tuju.length ? ', diteruskan kepada ' + esc(last.tuju.join(', ')) : '') + '</div>' +
        (catatan.length ? '<ul class="prev-notes">' + catatan.map(g => '<li><b>' + esc(g.dari) + ':</b> ' + esc(g.cat) + '</li>').join('') + '</ul>' : '<div class="sub">Tanpa catatan.</div>');
      box.hidden = false;
    } catch (e) { /* kotak ini hanya tambahan; riwayat lengkap tetap ada di atas */ }
  }

  async function showLanjut() {
    const box = $('#lanjutBox');
    if (!box) return;
    box.hidden = false;
    box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    if (S.detail) fillPrevBox(S.detail.kode);
    const sel = $('#l_petunjuk');
    if (sel) sel.focus({ preventScroll: true });
    const checks = $('#l_checks');
    if (checks && !checks.querySelector('input')) {
      try {
        const list = await getPejabatCached();
        const c = $('#l_checks');
        if (!c) return;
        const selesaiItem = '<label class="check check-selesai"><input type="checkbox" class="l-target l-selesai" value="Selesai" data-change="l-selesai"><span><b>Selesai</b>, surat sudah tuntas dan tidak diteruskan ke siapa pun</span></label>';
        c.innerHTML = selesaiItem + list.filter(p => p['Jabatan']).map(p =>
          '<label class="check"><input type="checkbox" class="l-target" value="' + esc(p['Jabatan']) + '"><span>' + esc(p['Jabatan']) + '</span></label>').join('');
      } catch (e) {
        const c = $('#l_checks');
        if (c) c.innerHTML = '<p class="sub">Daftar jabatan gagal dimuat: ' + esc(errMsg(e)) + '</p>';
      }
    }
  }

  /** Menyisipkan/mengganti satu surat di daftar memori. Tidak ada panggilan server. */
  function upsertMasuk(row) {
    if (!row || !row['Kode Tracking']) return;
    const kode = row['Kode Tracking'];
    REG.masuk[kode] = row;
    const y = row['Diterima Tanggal'] ? new Date(row['Diterima Tanggal']).getFullYear() : null;
    if (S.masuk.tahun && y && y !== S.masuk.tahun) return;       // tahun lain: tidak masuk daftar yang sedang tampil
    const i = S.masuk.rows.findIndex(r => r['Kode Tracking'] === kode);
    if (i >= 0) S.masuk.rows[i] = row; else { S.masuk.rows.unshift(row); S.masuk.page = 1; }   // daftar urut terbaru di depan
    updateDisposisiBadge();
  }
  function upsertKeluar(row) {
    if (!row || !row['Nomor Surat Lengkap']) return;
    const nomor = row['Nomor Surat Lengkap'];
    REG.keluar[nomor] = row;
    const y = row['Tanggal'] ? new Date(row['Tanggal']).getFullYear() : null;
    if (S.keluar.tahun && y && y !== S.keluar.tahun) return;
    const i = S.keluar.rows.findIndex(r => r['Nomor Surat Lengkap'] === nomor);
    if (i >= 0) S.keluar.rows[i] = row; else { S.keluar.rows.unshift(row); S.keluar.page = 1; }
  }
  /** Menyorot baris yang baru berubah sebentar supaya perubahannya terlihat. */
  function flashRow(selector) {
    const el = $(selector);
    if (!el) return;
    el.classList.remove('row-flash');
    void el.offsetWidth;                         // mulai ulang animasi
    el.classList.add('row-flash');
    setTimeout(() => el.classList.remove('row-flash'), 1800);
  }
  const attrSel = (attr, val) => 'tr[' + attr + '="' + String(val).replace(/["\\]/g, '\\$&') + '"]';

  /**
   * Menerapkan hasil perubahan dari server: ganti baris di memori, gambar ulang
   * daftar/panel di tempat. TANPA memuat ulang data. Beranda tetap mengambil
   * statistik baru (satu panggilan, dari cache server).
   */
  async function refreshAfterMutation(kode, row) {
    dataChanged();
    if (row) {
      upsertMasuk(row);
      if (S.page === 'masuk') { renderMasukList(); flashRow(attrSel('data-kode', kode)); }
      else if (S.page === 'dashboard') await navigateTo('dashboard', { soft: true });
    } else {
      S.masuk.fetchedAt = 0;                       // tidak ada baris dari server: paksa ambil ulang
      if (S.page === 'masuk' || S.page === 'dashboard') await navigateTo(S.page, { soft: true });
    }
    if (S.sheetKind === 'detail' && S.detail && S.detail.kode === kode && REG.masuk[kode]) openMasukDrawer(REG.masuk[kode]);
  }

  async function tandaiSelesai(kode) {
    const ok = await confirmDialog({
      title: 'Tandai surat ini selesai?',
      message: 'Rantai disposisi ' + kode + ' akan ditutup dan statusnya menjadi Selesai. Surat tidak bisa menerima disposisi lanjutan lagi.',
      confirmLabel: 'Tandai selesai'
    });
    if (!ok) return;
    try {
      const res = await gs('tandaiDisposisiSelesai', kode);
      if (res && res.success) { toast('Surat ditandai selesai.', { type: 'ok' }); await refreshAfterMutation(kode, res.row); }
      else toast((res && res.message) || 'Surat belum bisa ditandai selesai.', { type: 'err' });
    } catch (e) { toast('Gagal menandai selesai: ' + errMsg(e), { type: 'err' }); }
  }

  async function submitLanjut(kode) {
    const petunjuk = ($('#l_petunjuk') || {}).value || '';
    clearErrs($('#lanjutBox'));
    const msg = $('#l_msg'); if (msg) msg.hidden = true;
    const selesai = !!$('.l-selesai:checked');
    if (!petunjuk && !selesai) { const c = fieldErr('petunjuk', 'Pilih petunjuk disposisi, atau pilih Selesai.'); if (c) c.focus(); return; }
    const diteruskan = selesai ? 'Selesai' : $$('.l-target:checked').map(el => el.value).join('; ');
    const catatan = ($('#l_catatan') || {}).value || '';
    const btn = $('#btnLanjutkan');
    setBusy(btn, true, 'Menyimpan…');
    try {
      const res = await gs('lanjutkanDisposisiManual', kode, { petunjuk: petunjuk, diteruskanKepada: diteruskan, catatan: catatan, selesai: selesai });
      if (res && res.success) {
        toast(res.selesai ? 'Surat ditandai selesai.' : 'Disposisi dicatat. ' + (res.statusLanjut || ''), { type: 'ok' });
        await refreshAfterMutation(kode, res.row);
      } else {
        setBusy(btn, false);
        if (msg) { msg.hidden = false; msg.innerHTML = ico('alert') + '<span>' + esc((res && res.message) || 'Disposisi belum bisa dicatat.') + '</span>'; }
      }
    } catch (e) {
      setBusy(btn, false);
      if (msg) { msg.hidden = false; msg.innerHTML = ico('alert') + '<span>' + esc('Gagal menyimpan: ' + errMsg(e)) + '</span>'; }
    }
  }

  /* ============================================================
   *  FORM CATAT SURAT MASUK
   * ============================================================ */
  function kelompokTujuan(jabatan) {
    const j = (jabatan || '').toLowerCase();
    if (j.indexOf('hakim') === 0) return 'Hakim';
    if (j.indexOf('ketua') > -1) return 'Pimpinan';
    if (j.indexOf('panitera') > -1) return 'Kepaniteraan';
    if (j.indexOf('sekretaris') > -1 || j.indexOf('kasubbag') > -1) return 'Kesekretariatan';
    return 'Lainnya';
  }

  function openMasukForm() {
    const last = { tujuan: store.get('tujuan') || '', klas: store.get('klas') || '', jenis: store.get('jenis') || '', sifat: store.get('sifat') || '', index: store.get('index') || '' };
    const SIFAT = ['Biasa', 'Penting', 'Segera', 'Sangat Segera', 'Rahasia'];

    const STATUS = ['Asli', 'Tembusan', 'Salinan', 'Fotokopi'];

    const body =
      '<form id="formMasuk" data-submit="save-masuk" novalidate>' +
      '<div class="field" data-field="dari"><label for="f_dari">Dari</label><input type="text" id="f_dari" placeholder="Instansi atau pihak pengirim" data-autofocus autocomplete="off"><div class="err" role="alert"></div></div>' +
      '<div class="field" data-field="hal"><label for="f_hal">Hal</label><input type="text" id="f_hal" placeholder="Perihal surat" autocomplete="off"><div class="err" role="alert"></div></div>' +
      '<div class="field" data-field="tujuan"><label for="f_tujuan">Ditujukan kepada (disposisi awal)</label>' +
      '<select id="f_tujuan" data-change="tujuan-change"><option value="">Memuat…</option></select><div class="err" role="alert"></div></div>' +
      '<div class="field" data-field="email"><label for="f_email">Email penerima</label><input type="email" id="f_email" placeholder="nama@pengadilan.go.id" autocomplete="off">' +

  async function loadMasukSelects(last) {
    try {
      const res = await Promise.all([getPejabatCached(), getKlasifikasiCached()]);
      const pj = res[0], kl = res[1];
      S.pejabatList = pj;
      const sel = $('#f_tujuan');
      if (!sel) return;
      const groups = {};
      pj.forEach(p => { if (!p['Jabatan']) return; (groups[kelompokTujuan(p['Jabatan'])] = groups[kelompokTujuan(p['Jabatan'])] || []).push(p); });
      sel.innerHTML = '<option value="">Pilih tujuan…</option>' + URUTAN_KELOMPOK_TUJUAN.filter(g => groups[g]).map(g =>
        '<optgroup label="' + g + '">' + groups[g].map(p =>
          '<option value="' + esc(p['Jabatan']) + '">' + esc(p['Jabatan']) + (p['Nama Pejabat'] ? ' — ' + esc(p['Nama Pejabat']) : '') + '</option>').join('') + '</optgroup>').join('');
      if (last.tujuan && pj.some(p => p['Jabatan'] === last.tujuan)) sel.value = last.tujuan;
      onTujuanChange();
      const ks = $('#f_klas');
      if (ks) {
        ks.innerHTML = kl.map(k => '<option value="' + esc(k['Kode Klasifikasi']) + '">' + esc(k['Kode Klasifikasi']) + ' — ' + esc(k['Nama Klasifikasi / Subjek']) + '</option>').join('');
        if (last.klas) ks.value = last.klas;
      }
    } catch (e) { toast('Daftar jabatan atau klasifikasi gagal dimuat: ' + errMsg(e), { type: 'err' }); }
  }

  function onTujuanChange() {
    const sel = $('#f_tujuan'), emailInput = $('#f_email'), hint = $('#f_tujuanHint');
    if (!sel || !emailInput) return;
    const found = S.pejabatList.find(p => p['Jabatan'] === sel.value);
    emailInput.value = (found && found['Email']) || '';
    if (!hint) return;
    const adaEmail = found && found['Email'], adaWa = found && found['No. WhatsApp'];
    hint.textContent = !found ? '' :
      (adaEmail && adaWa) ? 'Notifikasi dikirim lewat email dan WhatsApp.' :
      adaEmail ? 'Notifikasi dikirim lewat email. No. WhatsApp belum diisi di Data Master.' :
      adaWa ? 'Notifikasi dikirim lewat WhatsApp. Isi email di sini jika ingin ikut dikirimi email.' :
      'Email dan WhatsApp penerima belum ada di Data Master. Isi email di kolom ini, atau lengkapi Data Master.';
  }

  async function saveMasuk() {
    const f = $('#formMasuk');
    clearErrs(f);
    const v = id => (($('#' + id) || {}).value || '');
    const dari = v('f_dari').trim(), hal = v('f_hal').trim(), tujuan = v('f_tujuan'), email = v('f_email').trim();
    let first = null;
    const bad = (n, m) => { const c = fieldErr(n, m); if (!first) first = c; };
    if (!dari) bad('dari', 'Isi nama instansi atau pihak pengirim.');
    if (!hal) bad('hal', 'Isi perihal surat.');
    if (!tujuan) bad('tujuan', 'Pilih tujuan surat.');
    const penerima = S.pejabatList.find(p => p['Jabatan'] === tujuan);
    if (tujuan && !email && !(penerima && penerima['No. WhatsApp'])) bad('email', 'Isi email penerima, atau lengkapi email/WhatsApp-nya di Data Master.');
    const file = ($('#f_lampiran') || {}).files && $('#f_lampiran').files[0];
    if (file && !(file.type === 'application/pdf' || /\.pdf$/i.test(file.name))) {
      const c = $('#f_lampiran'); toast('Lampiran harus berupa file PDF.', { type: 'err' }); if (!first) first = c;
    }
    if (first) { first.focus(); return; }

    const btn = $('#btnSaveMasuk');
    setBusy(btn, true, 'Menyimpan…');
    const formData = {
      nomorNaskahDinas: v('f_nomorNaskah'), tanggalNaskahDinas: v('f_tglNaskah'), dari: dari,
      sifat: v('f_sifat'), jenis: v('f_jenis'), indexBidang: v('f_index'), hal: hal,
      statusNaskah: v('f_statusNaskah'), kodeKlasifikasi: v('f_klas'), pimpinanTujuan: tujuan, emailPimpinan: email
    };
    try {
      if (file) { formData.lampiranBase64 = await readFileBase64(file); formData.lampiranFileName = file.name; }
      const res = await gs('tambahSuratMasuk', formData);
      store.set('tujuan', tujuan); store.set('klas', formData.kodeKlasifikasi); store.set('jenis', formData.jenis); store.set('sifat', formData.sifat); store.set('index', formData.indexBidang);
      dataChanged();
      closeSheet();
      const kode = res.kodeTracking;
      upsertMasuk(res.row);                                    // tampil seketika, tanpa memuat ulang daftar
      if (S.masuk.tab === 'selesai') S.masuk.tab = 'aktif';
      toast('Surat dicatat dan ditujukan kepada ' + res.tujuan + '. Kode tracking ' + kode + '.\nMengirim notifikasi…',
        { type: 'ok', actionLabel: 'Cetak lembar disposisi', onAction: () => openCetak(kode), duration: 9000 });
      if (res.lampiranGagal) toast('Surat tersimpan, tetapi lampiran PDF belum terunggah: ' + res.lampiranGagal + '\nUnggah ulang lewat panel detail.', { type: 'warn', duration: 12000 });
      if (S.page === 'masuk') { renderMasukList(); flashRow(attrSel('data-kode', kode)); }
      else if (S.page === 'dashboard') await navigateTo('dashboard', { soft: true });
      else await navigateTo('masuk');

      // Email dan WhatsApp dikirim di latar belakang; hasilnya muncul sebagai notifikasi kedua.
      gs('kirimNotifikasiSuratMasuk', kode).then(n => {
        const kanal = [n.emailTerkirim ? 'email' : null, n.waTerkirim ? 'WhatsApp' : null].filter(Boolean).join(' dan ');
        if (kanal) toast('Notifikasi ' + kode + ' terkirim lewat ' + kanal + '.', { type: 'ok' });
        else toast('Notifikasi ' + kode + ' belum terkirim. Teruskan manual atau lengkapi email/WhatsApp di Data Master.', { type: 'warn', duration: 12000 });
      }).catch(err => toast('Notifikasi ' + kode + ' gagal dikirim: ' + errMsg(err) + '\nTeruskan manual dari panel detail.', { type: 'err' }));
    } catch (e) {
      setBusy(btn, false);
      toast('Surat belum tersimpan: ' + errMsg(e), { type: 'err' });
    }
  }

  PAGES.keluar = async function (token) {
    const k = S.keluar;
    if (k.fetchedAt) {
      renderKeluarPage();
      if (Date.now() - k.fetchedAt < FRESH_MS) return;
    }
    const res = await gs('getSuratKeluarList', k.tahun || undefined);
    if (stale(token)) return;
    setKeluarData(res);
    renderKeluarPage();
  };

  function renderKeluarPage() {
    const k = S.keluar;
    $('#content').innerHTML =
      '<div class="toolbar"><div class="toolbar-l">' +
      yearSelect(k.tahunTersedia, k.tahun, 'year-keluar') +
      '<div class="filter-box">' + ico('search') + '<input type="search" data-input="q-keluar" value="' + esc(k.q) + '" placeholder="Filter daftar ini" aria-label="Filter daftar surat keluar" autocomplete="off"></div>' +
      '</div><button type="button" class="btn btn-primary" data-act="add-keluar">' + ico('plus') + 'Surat keluar</button></div>' +
      '<div class="tabs" role="tablist" id="keluarTabs"></div>' +
      '<div class="card card-flush" id="keluarList"></div>';

  function keluarFilterFn(tab) {
    if (tab === 'terbit') return r => r['Status'] !== 'Konsep';
    if (tab === 'konsep') return r => r['Status'] === 'Konsep';
    return () => true;
  }

  function renderKeluarList() {
    const k = S.keluar;
    const tabs = [['semua', 'Semua'], ['terbit', 'Diterbitkan'], ['konsep', 'Konsep']];
    $('#keluarTabs').innerHTML = tabs.map(t => {
      const n = k.rows.filter(keluarFilterFn(t[0])).length;
      return '<button type="button" role="tab" class="tab' + (k.tab === t[0] ? ' on' : '') + '" aria-selected="' + (k.tab === t[0]) + '" data-act="tab-keluar" data-tab="' + t[0] + '">' + t[1] + '<span class="count">' + n + '</span></button>';
    }).join('');

    const q = k.q.trim().toLowerCase();
    let rows = k.rows.filter(keluarFilterFn(k.tab));
    if (q) {
      const f = ['Nomor Surat Lengkap', 'Perihal', 'Tujuan', 'Pejabat Penandatangan'];
      rows = rows.filter(r => f.some(x => String(r[x] == null ? '' : r[x]).toLowerCase().indexOf(q) > -1));
    }
    const box = $('#keluarList');
    if (!rows.length) {
      box.innerHTML = emptyState('send', q ? 'Tidak ada surat yang cocok dengan "' + k.q + '".' : 'Belum ada surat keluar di tahun ' + k.tahun + '.', '',
        !q && k.tab !== 'terbit' ? '<button type="button" class="btn btn-primary" data-act="add-keluar">' + ico('plus') + 'Buat surat keluar</button>' : '');
      return;
    }
    const total = rows.length, nHal = Math.max(1, Math.ceil(total / k.size));
    if (k.page > nHal) k.page = nHal;
    if (k.page < 1) k.page = 1;
    const pageRows = rows.slice((k.page - 1) * k.size, k.page * k.size);
    box.innerHTML = '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nomor surat</th><th>Perihal</th><th>Tanggal</th><th>Penandatangan</th><th>Status</th><th><span class="sr-only">Aksi</span></th></tr></thead><tbody>' +
      pageRows.map(r => {
        const nomor = r['Nomor Surat Lengkap'];
        const url = safeUrl(r['File PDF (URL)']);
        return '<tr class="row-click" data-act="open-keluar" data-nomor="' + esc(nomor) + '">' +
          '<td data-label="Nomor surat"><span class="mono strong">' + esc(nomor || '-') + '</span></td>' +
          '<td data-label="Perihal" class="cell-main"><button type="button" class="link-title" data-act="open-keluar" data-nomor="' + esc(nomor) + '">' + esc(r['Perihal'] || '(Tanpa perihal)') + '</button><div class="sub">Kepada ' + esc(r['Tujuan'] || '-') + '</div></td>' +
          '<td data-label="Tanggal">' + formatDate(r['Tanggal']) + '</td>' +
          '<td data-label="Penandatangan">' + esc(r['Pejabat Penandatangan'] || '-') + '</td>' +
          '<td data-label="Status">' + statusBadge(r['Status']) + (url ? '' : ' <span class="badge b-warn">Belum ada file</span>') + '</td>' +
          '<td data-label="" class="cell-actions">' +
          (url ? '<a class="btn-icon" href="' + esc(url) + '" target="_blank" rel="noopener" aria-label="Buka file PDF" title="Buka file PDF">' + ico('clip') + '</a>' : '') +
          '<button type="button" class="btn btn-secondary btn-sm" data-act="open-keluar" data-nomor="' + esc(nomor) + '">' + ico('pencil') + 'Edit</button>' +
          '</td></tr>';
      }).join('') + '</tbody></table></div>' + pagerHTML('keluar', total, k.page, k.size);
  }

  async function loadKeluarSelects(last) {
    try {
      const res = await Promise.all([getPejabatCached(), getKlasifikasiCached()]);
      const ps = $('#k_penandatangan'), ks = $('#k_klas');
      if (!ps || !ks) return;
      ps.innerHTML = res[0].map(p => '<option value="' + esc(p['Kode']) + '">' + esc(p['Jabatan']) + ' (' + esc(p['Kode']) + ')</option>').join('');
      if (last.pen && res[0].some(p => p['Kode'] === last.pen)) ps.value = last.pen;
      ks.innerHTML = res[1].map(k => '<option value="' + esc(k['Kode Klasifikasi']) + '">' + esc(k['Kode Klasifikasi']) + ' — ' + esc(k['Nama Klasifikasi / Subjek']) + '</option>').join('');
      if (last.klas) ks.value = last.klas;
      updateNomorPreview();
    } catch (e) { toast('Daftar penandatangan atau klasifikasi gagal dimuat: ' + errMsg(e), { type: 'err' }); }
  }

  function updateNomorPreview() {
    const tgl = $('#k_tanggal'), pen = $('#k_penandatangan'), jen = $('#k_jenis'), kl = $('#k_klas'), prev = $('#nomorPreviewValue');
    if (!tgl || !tgl.value || !prev) return;
    const d = new Date(tgl.value + 'T00:00:00');
    const bulan = ROMAN_MONTHS_JS[d.getMonth()], tahun = d.getFullYear();
    const kodeP = pen && pen.value ? pen.value : '___';
    const TAG = { 'Surat Tugas': 'ST.', 'Undangan': 'UND.', 'Surat Edaran': 'SE.', 'Surat Keputusan': 'SK.' };
    const tag = jen && jen.value ? (TAG[jen.value] || '') : '';
    const kodeK = kl && kl.value ? tag + kl.value : '___';
    const tail = '/' + kodeP + '/' + KODE_INSTANSI_JS + '/' + kodeK + '/' + bulan + '/' + tahun;
    prev.textContent = '?' + tail;
    const tok = ++S.prevTok;
    gs('previewNomorUrutKeluar', tahun).then(n => {
      const el = $('#nomorPreviewValue');
      if (tok === S.prevTok && el) el.textContent = n + tail;
    }).catch(() => { /* pratinjau saja, boleh gagal */ });
  }

  async function saveKeluar(mode) {
    const f = $('#formKeluar');
    clearErrs(f);
    const v = id => (($('#' + id) || {}).value || '');
    const tanggal = v('k_tanggal'), pen = v('k_penandatangan'), jenis = v('k_jenis'), klas = v('k_klas'), perihal = v('k_perihal').trim(), tujuan = v('k_tujuan').trim();
    const file = $('#k_file') && $('#k_file').files && $('#k_file').files[0];
    let first = null;
    const bad = (n, m) => { const c = fieldErr(n, m); if (!first) first = c; };
    if (!perihal) bad('perihal', 'Isi perihal surat.');
    if (!tujuan) bad('tujuan', 'Isi tujuan surat.');
    if (mode === 'simpan' && !file) bad('file', 'Unggah file PDF untuk menerbitkan. Pakai Simpan konsep jika file belum siap.');
    if (file && !(file.type === 'application/pdf' || /\.pdf$/i.test(file.name))) bad('file', 'File harus berformat PDF.');
    if (!tanggal || !pen || !klas) { toast('Lengkapi tanggal, penandatangan, dan klasifikasi.', { type: 'err' }); if (!first) first = $('#k_tanggal'); }
    if (first) { first.focus(); return; }

    const btn = mode === 'simpan' ? $('#btnSimpanK') : $('#btnKonsepK');
    const other = mode === 'simpan' ? $('#btnKonsepK') : $('#btnSimpanK');
    setBusy(btn, true, 'Menyimpan…'); if (other) other.disabled = true;
    const formData = { tanggalSurat: tanggal, penandatanganKode: pen, jenisSurat: jenis, kodeKlasifikasi: klas, perihal: perihal, tujuan: tujuan, status: mode === 'simpan' ? 'Diterbitkan' : 'Konsep' };
    try {
      if (file) { formData.fileBase64 = await readFileBase64(file); formData.fileFileName = file.name; }
      const res = await gs('tambahSuratKeluar', formData);
      store.set('k_pen', pen); store.set('k_klas', klas); store.set('k_jenis', jenis);
      dataChanged();
      closeSheet();
      toast((res.status === 'Konsep' ? 'Konsep tersimpan. ' : 'Surat diterbitkan. ') + 'Nomor ' + res.nomorLengkap,
        { type: 'ok', actionLabel: 'Salin nomor', duration: 12000, onAction: () => copyText(res.nomorLengkap).then(ok => toast(ok ? 'Nomor surat disalin.' : 'Nomor belum bisa disalin otomatis. Salin manual dari daftar.', { type: ok ? 'ok' : 'warn' })) });
      upsertKeluar(res.row);                                    // tampil seketika, tanpa memuat ulang daftar
      if (S.page === 'keluar') { renderKeluarList(); flashRow(attrSel('data-nomor', res.nomorLengkap)); }
      else if (S.page === 'dashboard') await navigateTo('dashboard', { soft: true });
      else await navigateTo('keluar');
    } catch (e) {
      setBusy(btn, false); if (other) other.disabled = false;
      toast('Surat belum tersimpan: ' + errMsg(e), { type: 'err' });
    }
  }

      '</form><p class="hint">Nomor, tanggal, penandatangan, dan klasifikasi sudah menjadi bagian dari nomor surat, jadi tidak bisa diubah.</p>';
    const foot =
      '<button type="button" class="btn btn-ghost" data-act="close-sheet">Batal</button>' +
      '<button type="button" class="btn btn-secondary" id="btnKonsepE" data-act="save-keluar-edit" data-mode="konsep" data-nomor="' + esc(nomor) + '">Simpan konsep</button>' +
      '<button type="button" class="btn btn-primary" id="btnSimpanE" data-act="save-keluar-edit" data-mode="simpan" data-nomor="' + esc(nomor) + '">' + (r['Status'] === 'Konsep' ? 'Terbitkan surat' : 'Simpan perubahan') + '</button>';
    openSheet({ kind: 'form', title: 'Edit surat keluar', sub: statusBadge(r['Status']), body: body, foot: foot });

  async function saveKeluarEdit(nomor, mode) {
    const f = $('#formKeluarEdit');
    clearErrs(f);
    const r = REG.keluar[nomor];
    const perihal = (($('#e_perihal') || {}).value || '').trim(), tujuan = (($('#e_tujuan') || {}).value || '').trim();
    const file = $('#e_file') && $('#e_file').files && $('#e_file').files[0];
    let first = null;
    const bad = (n, m) => { const c = fieldErr(n, m); if (!first) first = c; };
    if (!perihal) bad('perihal', 'Isi perihal surat.');
    if (!tujuan) bad('tujuan', 'Isi tujuan surat.');
    if (mode === 'simpan' && !file && !(r && r['File PDF (URL)'])) bad('file', 'Unggah file PDF untuk menerbitkan. Pakai Simpan konsep jika file belum siap.');
    if (file && !(file.type === 'application/pdf' || /\.pdf$/i.test(file.name))) bad('file', 'File harus berformat PDF.');
    if (first) { first.focus(); return; }

    const btn = mode === 'simpan' ? $('#btnSimpanE') : $('#btnKonsepE');
    const other = mode === 'simpan' ? $('#btnKonsepE') : $('#btnSimpanE');
    setBusy(btn, true, 'Menyimpan…'); if (other) other.disabled = true;
    const formData = { perihal: perihal, tujuan: tujuan, status: mode === 'simpan' ? 'Diterbitkan' : 'Konsep' };
    try {
      if (file) { formData.fileBase64 = await readFileBase64(file); formData.fileFileName = file.name; }
      const res = await gs('updateSuratKeluar', nomor, formData);
      if (res && res.success === false) throw new Error(res.message || 'Surat belum bisa diperbarui.');
      dataChanged();
      closeSheet();
      toast(res.status === 'Konsep' ? 'Konsep diperbarui.' : 'Surat diperbarui dan berstatus diterbitkan.', { type: 'ok' });
      if (res.row) {
        upsertKeluar(res.row);
        if (S.page === 'keluar') { renderKeluarList(); flashRow(attrSel('data-nomor', nomor)); }
      } else {
        S.keluar.fetchedAt = 0;
        if (S.page === 'keluar') await navigateTo('keluar', { soft: true });
      }
    } catch (e) {
      setBusy(btn, false); if (other) other.disabled = false;
      toast('Surat belum diperbarui: ' + errMsg(e), { type: 'err' });
    }
  }

  function fitLembarFrame() {
    const fr = $('#lembarFrame');
    if (!fr) return;
    try {
      const de = fr.contentDocument && fr.contentDocument.documentElement;
      if (!de) return;
      de.style.zoom = Math.min(1, fr.clientWidth / 794); // lebar A4 ± 794px
    } catch (e) { /* abaikan */ }
  }

  async function openCetak(kode) {
    S.lembarHtml = '';
    openDialog(
      '<div class="dialog-head"><div><h2 class="dialog-title">Lembar disposisi</h2><div class="sub mono">' + esc(kode) + '</div></div>' +
      '<button type="button" class="btn-icon" data-act="close-dialog" aria-label="Tutup pratinjau">' + ico('x') + '</button></div>' +
      '<div class="dialog-body dialog-body-flush" id="cetakBody"><div class="preview-loading"><span class="spin spin-lg" aria-hidden="true"></span><p class="sub">Menyiapkan lembar disposisi…</p></div></div>' +
      '<div class="dialog-foot" id="cetakFoot"><button type="button" class="btn btn-secondary" data-act="close-dialog">Tutup</button></div>', true);
    try {
      const res = await gs('getLembarDisposisiHtml', kode);
      const body = $('#cetakBody');
      if (!body) return; // dialog sudah ditutup
      if (!res.success) { body.innerHTML = emptyState('alert', 'Lembar belum bisa disiapkan', res.message || '', ''); return; }
      S.lembarHtml = res.html;
      body.innerHTML = '<iframe id="lembarFrame" class="preview-frame" title="Pratinjau lembar disposisi"></iframe>';
      const fr = $('#lembarFrame');
      fr.onload = fitLembarFrame;
      fr.srcdoc = res.html;
      $('#cetakFoot').innerHTML =
        '<button type="button" class="btn btn-ghost" data-act="close-dialog">Tutup</button>' +
        '<button type="button" class="btn btn-secondary" id="btnSimpanDrive" data-act="simpan-drive" data-kode="' + esc(kode) + '" title="Membuat file PDF permanen di Google Drive (5–15 detik)">' + ico('cloud') + 'Simpan PDF ke Drive</button>' +
        '<button type="button" class="btn btn-secondary" data-act="tab-baru">' + ico('external') + 'Buka di tab baru</button>' +
        '<button type="button" class="btn btn-primary" data-act="cetak-frame">' + ico('printer') + 'Cetak atau simpan PDF</button>';
    } catch (e) {
      const body = $('#cetakBody');
      if (body) body.innerHTML = emptyState('alert', 'Lembar belum bisa dimuat', errMsg(e), '');
    }
  }

  function cetakFrame() {
    const fr = $('#lembarFrame');
    try {
      const de = fr.contentDocument.documentElement;
      const zoomLama = de.style.zoom;
      de.style.zoom = 1; // cetak harus pada skala 100%
      const pulihkan = () => { de.style.zoom = zoomLama; };
      fr.contentWindow.onafterprint = pulihkan;
      setTimeout(pulihkan, 4000);
      fr.contentWindow.focus();
      fr.contentWindow.print();
    } catch (e) { bukaTabBaru(); }
  }
  function bukaTabBaru() {
    if (!S.lembarHtml) return;
    const w = window.open('', '_blank');
    if (!w) { toast('Popup diblokir browser. Izinkan popup untuk situs ini, lalu coba lagi.', { type: 'warn' }); return; }
    w.document.open(); w.document.write(S.lembarHtml); w.document.close();
    setTimeout(() => { try { w.focus(); w.print(); } catch (e) { /* abaikan */ } }, 500);
  }
