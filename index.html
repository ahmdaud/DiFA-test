<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>DiFA | Disposisi From Anywhere</title>
  <script>
    /* Terapkan tema sebelum halaman digambar agar tidak berkedip. */
    (function () {
      try {
        var t = localStorage.getItem('difa:theme');
        if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
        document.documentElement.setAttribute('data-theme', t || 'light');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <style>
  /* ============================================================
   *  DiFA — Design System v2.0
   *  Soft UI: permukaan putih, border tipis, bayangan hanya untuk
   *  elemen yang melayang (drawer, dialog, toast, hasil pencarian).
   *  Kontras teks minimal 4.5:1 pada tema terang maupun gelap.
   * ============================================================ */
  :root {
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    --font-head: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    --bg: #f8fafc;
    --surface: #ffffff;
    --surface-2: #f1f5f9;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text: #0f172a;
    --text-2: #475569;
    --text-3: #556579;

    --brand: #075985;
    --brand-hover: #0c4a6e;
    --on-brand: #ffffff;
    --brand-soft: #e0f2fe;
    --brand-ink: #075985;

    --ok: #0f766e;       --ok-soft: #f0fdfa;      --ok-ink: #115e59;
    --warn: #b45309;     --warn-soft: #fffbeb;    --warn-ink: #92400e;
    --danger: #b91c1c;   --danger-hover: #991b1b; --danger-soft: #fef2f2; --danger-ink: #991b1b;
    --info-soft: #e0f2fe; --info-ink: #075985;
    --muted-soft: #f1f5f9; --muted-ink: #475569;

    --side-bg: #0f172a;
    --side-text: #cbd5e1;
    --side-dim: #94a3b8;
    --side-hover: rgba(255, 255, 255, 0.07);
    --side-active: rgba(255, 255, 255, 0.11);
    --side-accent: #38bdf8;

    --c1: #0369a1; --c2: #0d9488; --c3: #d97706; --c4: #e11d48; --c5: #7c3aed; --c6: #64748b;

    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;
    --shadow-float: 0 16px 40px rgba(15, 23, 42, 0.22);
    --overlay: rgba(15, 23, 42, 0.5);
  }

  html[data-theme="dark"] {
    --bg: #0b1220;
    --surface: #111a2c;
    --surface-2: #18243a;
    --border: #25334d;
    --border-strong: #38496a;
    --text: #e6edf6;
    --text-2: #b4c2d6;
    --text-3: #93a4bc;

    --brand: #38bdf8;
    --brand-hover: #7dd3fc;
    --on-brand: #06121f;
    --brand-soft: rgba(56, 189, 248, 0.14);
    --brand-ink: #7dd3fc;

    --ok: #2dd4bf;       --ok-soft: rgba(45, 212, 191, 0.14);  --ok-ink: #5eead4;
    --warn: #fbbf24;     --warn-soft: rgba(251, 191, 36, 0.14); --warn-ink: #fcd34d;
    --danger: #dc2626;   --danger-hover: #b91c1c; --danger-soft: rgba(248, 113, 113, 0.14); --danger-ink: #fca5a5;
    --info-soft: rgba(56, 189, 248, 0.14); --info-ink: #7dd3fc;
    --muted-soft: #1d2a42; --muted-ink: #b4c2d6;

    --side-bg: #0a101c;
    --c1: #38bdf8; --c2: #2dd4bf; --c3: #fbbf24; --c4: #fb7185; --c5: #a78bfa; --c6: #94a3b8;
    --shadow-float: 0 16px 40px rgba(0, 0, 0, 0.55);
    --overlay: rgba(2, 6, 14, 0.65);
  }

  /* ---------- Dasar ---------- */
  /* Reset dan pengaman lebar layar */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-x: hidden; }            /* merambat ke viewport, sticky tetap jalan */
  html, body { width: 100%; max-width: 100vw; }
  body { overflow-x: clip; }              /* clip (bukan hidden) agar header sticky tidak rusak */
  img, svg, canvas, video, iframe, input, select, textarea, button { max-width: 100%; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font); font-size: 14px; line-height: 1.5;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body.no-scroll { overflow: hidden; }
  h1, h2, h3, p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--brand); }
  code { font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .ico { width: 16px; height: 16px; flex: none; }
  .mono { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
  .strong { font-weight: 600; }
  .sub { font-size: 13px; color: var(--text-3); margin-top: 2px; }
  .pad { padding: 16px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .skip-link { position: absolute; left: -999px; top: 8px; z-index: 100; background: var(--brand); color: var(--on-brand); padding: 8px 14px; border-radius: var(--r-sm); }
  .skip-link:focus { left: 8px; }

  /* ---------- Cangkang ---------- */
  .app { display: flex; min-height: 100vh; width: 100%; max-width: 100vw; overflow-x: clip; }

  .sidebar {
    width: 240px; flex: none; background: var(--side-bg); color: var(--side-text);
    display: flex; flex-direction: column; padding: 18px 12px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 18px; }
  .brand-mark { width: 38px; height: 38px; border-radius: 10px; background: rgba(255, 255, 255, 0.1); display: grid; place-items: center; color: #fff; }
  .brand-mark .ico { width: 20px; height: 20px; }
  .brand-title { font: 700 17px var(--font-head); color: #fff; letter-spacing: 0.01em; }
  .brand-sub { font-size: 12px; color: var(--side-dim); line-height: 1.3; }
  .nav-group { margin-top: 8px; }
  .nav-label { font-size: 12px; color: var(--side-dim); padding: 10px 12px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px; width: 100%; height: 40px; padding: 0 12px;
    background: transparent; border: 0; border-radius: var(--r-sm); color: var(--side-text);
    font-size: 14px; text-align: left; transition: background 0.12s, color 0.12s;
  }
  .nav-item .nav-ico { display: grid; place-items: center; }
  .nav-item .ico { width: 18px; height: 18px; }
  .nav-item:hover { background: var(--side-hover); color: #fff; }
  .nav-item.active { background: var(--side-active); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 var(--side-accent); }
  .nav-item:focus-visible, .theme-btn:focus-visible { outline-color: #fff; }
  .sidebar-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
  .theme-btn { display: flex; align-items: center; gap: 12px; width: 100%; height: 40px; padding: 0 12px; background: transparent; border: 0; border-radius: var(--r-sm); color: var(--side-text); font-size: 13px; }
  .theme-btn:hover { background: var(--side-hover); color: #fff; }

  .main { flex: 1; min-width: 0; max-width: 100%; display: flex; flex-direction: column; }

  .topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px;
    padding: 12px 28px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: none; }
  .topbar h1 { font: 700 20px/1.2 var(--font-head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pageSubtitle { font-size: 13px; color: var(--text-3); margin-top: 2px; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar-spacer { flex: 1; }
  .search { position: relative; flex: 1; max-width: 420px; margin-left: auto; }
  .search input {
    width: 100%; height: 38px; padding: 0 64px 0 36px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 10px; font-size: 14px;
  }
  .search input:focus { background: var(--surface); border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px var(--brand-soft); }
  .search-ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-3); display: grid; pointer-events: none; }
  .kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: 500; padding: 1px 6px; border: 1px solid var(--border-strong); border-radius: 5px; color: var(--text-3); pointer-events: none; }
  .search-pop {
    position: absolute; top: 44px; left: 0; right: 0; z-index: 40; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-float);
    max-height: 62vh; overflow-y: auto; padding: 6px;
  }
  .sp-group { font-size: 12px; font-weight: 600; color: var(--text-3); padding: 8px 10px 4px; }
  .sp-item { display: flex; flex-direction: column; gap: 1px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: var(--r-sm); padding: 8px 10px; }
  .sp-item:hover, .sp-item:focus-visible { background: var(--surface-2); }
  .sp-main { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sp-sub { font-size: 12.5px; color: var(--text-3); }
  .sp-empty, .sp-foot { font-size: 13px; color: var(--text-3); padding: 10px; }
  .sp-foot { border-top: 1px solid var(--border); margin-top: 4px; font-size: 12px; }
  .topbar-actions { display: flex; gap: 8px; flex: none; }

  .content { flex: 1; width: 100%; max-width: 1280px; margin: 0 auto; padding: 24px 28px 48px; outline: none; }
  .content > * { min-width: 0; max-width: 100%; }
  .content > * + * { margin-top: 20px; }

  /* ---------- Tombol ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 14px;
    border: 1px solid transparent; border-radius: var(--r-sm); font-size: 14px; font-weight: 500; white-space: nowrap;
    text-decoration: none; transition: background 0.12s, border-color 0.12s;
  }
  .btn-sm { height: 32px; padding: 0 10px; font-size: 13px; }
  .btn-primary { background: var(--brand); color: var(--on-brand); }
  .btn-primary:hover:not(:disabled) { background: var(--brand-hover); }
  .btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
  .btn-secondary:hover:not(:disabled) { background: var(--surface-2); }
  .btn-ghost { background: transparent; color: var(--text-2); }
  .btn-ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover:not(:disabled) { background: var(--danger-hover); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-icon {
    display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; flex: none;
    background: transparent; border: 0; border-radius: var(--r-sm); color: var(--text-2); text-decoration: none;
  }
  .btn-icon:hover { background: var(--surface-2); color: var(--text); }
  .btn-icon-danger:hover { background: var(--danger-soft); color: var(--danger-ink); }
  .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: spin 0.7s linear infinite; }
  .spin-lg { width: 28px; height: 28px; border-width: 3px; color: var(--brand); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Kartu, KPI, toolbar, tab ---------- */
  .card { min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 18px 20px; }
  .card-flush { padding: 0; overflow: hidden; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 16px 20px 12px; }
  .card-title { font: 600 16px/1.3 var(--font-head); }
  .card-danger { border-color: var(--danger-ink); }
  html:not([data-theme="dark"]) .card-danger { border-color: #fecaca; }
  .card-narrow { max-width: 560px; }
  .card > .sub + .tbl-wrap, .card > .tbl-wrap { margin-top: 12px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 20px; }
  .chart-box { position: relative; width: 100%; max-width: 100%; height: 260px; margin-top: 12px; }
  .chart-box canvas { display: block; max-width: 100%; }
  .chart-box-sm { height: 220px; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 14px; }
  .kpi-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kpi {
    display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 16px 18px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); transition: border-color 0.12s;
  }
  button.kpi:hover { border-color: var(--border-strong); }
  .kpi-static { cursor: default; }
  .kpi-label { font-size: 13px; color: var(--text-2); font-weight: 500; }
  .kpi-value { font: 700 30px/1.15 var(--font-head); font-variant-numeric: tabular-nums; margin-top: 4px; }
  .kpi-sub { font-size: 12.5px; color: var(--text-3); }
  .kpi-brand { background: var(--brand-soft); border-color: transparent; }
  .kpi-brand .kpi-value { color: var(--brand-ink); }
  .kpi-danger .kpi-value { color: var(--danger-ink); }
  .kpi-danger { border-color: var(--danger-ink); }
  html:not([data-theme="dark"]) .kpi-danger { border-color: #fecaca; }
  .kpi-warn .kpi-value { color: var(--warn-ink); }

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .toolbar-l, .toolbar-r { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .select-sm {
    max-width: 100%; height: 38px; padding: 0 32px 0 12px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-sm); font-size: 14px;
  }
  .filter-box { position: relative; display: flex; align-items: center; }
  .filter-box .ico { position: absolute; left: 11px; color: var(--text-3); pointer-events: none; }
  .filter-box input { height: 38px; width: 240px; padding: 0 12px 0 34px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-sm); }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tab {
    display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; background: transparent; border: 0;
    border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--text-2); font-weight: 500; white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--brand-ink); border-bottom-color: var(--brand); }
  .count { font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--text-2); padding: 1px 8px; border-radius: 999px; font-variant-numeric: tabular-nums; }
  .tab.on .count { background: var(--brand-soft); color: var(--brand-ink); }
  .tabs + .card { margin-top: 16px; }
  .list-note { font-size: 12.5px; color: var(--text-3); padding: 10px 16px 0; }

  /* ---------- Tabel ---------- */
  .tbl-wrap { overflow-x: auto; }
  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--text-3); padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .tbl td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .tbl tbody tr:last-child td { border-bottom: 0; }
  .tbl .row-click { cursor: pointer; }
  .tbl .row-click:hover td { background: var(--surface-2); }
  .tbl-compact td { padding: 8px 14px; }
  .cell-main { min-width: 220px; max-width: 420px; }
  .cell-actions { white-space: nowrap; text-align: right; }
  .cell-actions > * + * { margin-left: 4px; }
  .link-title { background: none; border: 0; padding: 0; font-weight: 600; color: var(--text); text-align: left; }
  .link-title:hover { color: var(--brand-ink); text-decoration: underline; }
  .inline-ico { display: inline-flex; vertical-align: -3px; color: var(--text-3); margin-left: 6px; }
  .inline-ico:hover { color: var(--brand); }

  /* ---------- Lencana & umur surat ---------- */
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .b-warn { background: var(--warn-soft); color: var(--warn-ink); }
  .b-info { background: var(--info-soft); color: var(--info-ink); }
  .b-ok { background: var(--ok-soft); color: var(--ok-ink); }
  .b-muted { background: var(--muted-soft); color: var(--muted-ink); }
  .b-danger { background: var(--danger-soft); color: var(--danger-ink); }
  .age { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: var(--muted-soft); color: var(--muted-ink); white-space: nowrap; }
  .age .ico { width: 12px; height: 12px; }
  .age-stale { background: var(--warn-soft); color: var(--warn-ink); }
  .age-late { background: var(--danger-soft); color: var(--danger-ink); }

  /* ---------- Antrean di Beranda ---------- */
  .queue { list-style: none; margin: 0; padding: 0; }
  .q-item { display: grid; grid-template-columns: minmax(0, 1fr) 200px auto auto; align-items: center; gap: 16px; padding: 12px 20px; border-top: 1px solid var(--border); cursor: pointer; }
  .q-item:hover { background: var(--surface-2); }
  .q-main { min-width: 0; }
  .q-main .link-title { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q-holder { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 13px; min-width: 0; }
  .q-holder span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q-age { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

  /* ---------- Drawer & dialog ---------- */
  .overlay { position: fixed; inset: 0; z-index: 60; background: var(--overlay); display: flex; }
  .overlay-side { justify-content: flex-end; }
  .overlay-center { align-items: center; justify-content: center; z-index: 80; padding: 16px; }
  .sheet {
    width: min(540px, 100%); height: 100%; background: var(--surface); display: flex; flex-direction: column;
    box-shadow: var(--shadow-float); animation: slide-in 0.2s ease-out; outline: none;
  }
  .sheet-wide { width: min(780px, 100%); }
  .sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 20px 14px 24px; border-bottom: 1px solid var(--border); }
  .sheet-headtext { min-width: 0; }
  .sheet-title { font: 700 18px/1.3 var(--font-head); overflow-wrap: anywhere; }
  .sheet-sub { margin-top: 4px; font-size: 13px; color: var(--text-3); }
  .sheet-body { flex: 1; overflow-y: auto; padding: 20px 24px 28px; }
  .sheet-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 14px 24px; border-top: 1px solid var(--border); background: var(--surface); }
  @keyframes slide-in { from { transform: translateX(32px); opacity: 0; } to { transform: none; opacity: 1; } }

  .dialog {
    width: min(440px, 100%); max-height: 92vh; display: flex; flex-direction: column; background: var(--surface);
    border-radius: var(--r-lg); box-shadow: var(--shadow-float); outline: none; animation: pop-in 0.16s ease-out;
  }
  .dialog-wide { width: min(980px, 100%); }
  .dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .dialog-title { font: 700 17px/1.3 var(--font-head); }
  .dialog-msg { margin-top: 8px; color: var(--text-2); }
  .dialog-body { padding: 22px 22px 8px; overflow-y: auto; }
  .dialog-body-flush { padding: 0; flex: 1; min-height: 0; }
  .dialog-foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; padding: 16px 20px; }
  .dialog-wide .dialog-foot { border-top: 1px solid var(--border); }
  @keyframes pop-in { from { transform: translateY(8px) scale(0.98); opacity: 0; } to { transform: none; opacity: 1; } }
  .preview-frame { width: 100%; height: 68vh; min-height: 320px; border: 0; background: #e9edf2; display: block; }
  .preview-loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 64px 24px; }

  /* ---------- Toast ---------- */
  .toasts { position: fixed; right: 20px; bottom: 20px; z-index: 120; display: flex; flex-direction: column; gap: 10px; width: min(420px, calc(100vw - 32px)); pointer-events: none; }
  .toast {
    pointer-events: auto; display: flex; align-items: flex-start; gap: 10px; padding: 12px 12px 12px 14px;
    background: var(--surface); color: var(--text); border: 1px solid var(--border); border-left-width: 4px; border-radius: var(--r-md);
    box-shadow: var(--shadow-float); animation: pop-in 0.18s ease-out;
  }
  .toast.leaving { opacity: 0; transform: translateY(6px); transition: opacity 0.16s, transform 0.16s; }
  .toast-ico { display: grid; padding-top: 1px; }
  .toast-ico .ico { width: 18px; height: 18px; }
  .toast-msg { flex: 1; min-width: 0; white-space: pre-line; overflow-wrap: anywhere; }
  .toast-action { background: transparent; border: 0; padding: 2px 6px; font-weight: 600; color: var(--brand-ink); border-radius: 6px; white-space: nowrap; }
  .toast-action:hover { background: var(--brand-soft); }
  .toast-x { display: grid; place-items: center; width: 24px; height: 24px; background: transparent; border: 0; color: var(--text-3); border-radius: 6px; }
  .toast-x:hover { background: var(--surface-2); }
  .t-ok { border-left-color: var(--ok); } .t-ok .toast-ico { color: var(--ok); }
  .t-warn { border-left-color: var(--warn); } .t-warn .toast-ico { color: var(--warn); }
  .t-err { border-left-color: var(--danger); } .t-err .toast-ico { color: var(--danger-ink); }
  .t-info { border-left-color: var(--brand); } .t-info .toast-ico { color: var(--brand); }

  /* ---------- Form ---------- */
  .field { margin-bottom: 16px; }
  .field > label, .field > .label { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }
  .field > .label small { font-weight: 400; color: var(--text-3); margin-left: 6px; }
  .field-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .field input[type="text"], .field input[type="email"], .field input[type="date"], .field input[type="search"], .field select, .field textarea {
    width: 100%; min-height: 40px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-sm); font-size: 14px;
  }
  html[data-theme="dark"] .field input, html[data-theme="dark"] .field select, html[data-theme="dark"] .field textarea,
  html[data-theme="dark"] .select-sm, html[data-theme="dark"] .filter-box input { background: var(--surface-2); }
  .field input:disabled { background: var(--surface-2); color: var(--text-3); }
  .field textarea { resize: vertical; min-height: 84px; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .field [aria-invalid="true"] { border-color: var(--danger); }
  .field input[type="file"] { width: 100%; font-size: 13px; color: var(--text-2); padding: 8px; border: 1px dashed var(--border-strong); border-radius: var(--r-sm); background: var(--surface-2); }
  .hint { font-size: 12.5px; color: var(--text-3); margin-top: 6px; }
  .err { font-size: 12.5px; color: var(--danger-ink); margin-top: 6px; }
  .err:empty { display: none; }
  .more { margin: 4px 0 16px; border: 1px solid var(--border); border-radius: var(--r-md); }
  .more summary { cursor: pointer; padding: 11px 14px; font-weight: 500; color: var(--text-2); list-style: none; }
  .more summary::-webkit-details-marker { display: none; }
  .more summary::before { content: '+'; display: inline-block; width: 18px; font-weight: 700; color: var(--brand); }
  .more[open] summary::before { content: '\2212'; }
  .more-body { padding: 4px 14px 2px; border-top: 1px solid var(--border); padding-top: 14px; }
  .checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 12px; max-height: 220px; overflow-y: auto; padding: 6px 10px; border: 1px solid var(--border-strong); border-radius: var(--r-sm); }
  .check { display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 13.5px; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--brand); flex: none; }
  .inline-row { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
  .inline-row .field { margin: 0; min-width: 160px; }
  .inline-form { margin-top: 24px; padding: 18px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); }
  .inline-form .section-title { margin-top: 0; }
  .inline-form .hint { margin: 6px 0 14px; }
  .inline-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .nomor-card { padding: 14px 16px; background: var(--brand-soft); border-radius: var(--r-md); margin-bottom: 20px; }
  .nomor-label { font-size: 12.5px; color: var(--brand-ink); }
  .nomor-value { font-size: 15px; font-weight: 500; color: var(--brand-ink); margin-top: 4px; overflow-wrap: anywhere; }

  .banner { display: flex; align-items: flex-start; gap: 10px; padding: 11px 14px; border-radius: var(--r-sm); font-size: 13.5px; margin: 14px 0 0; }
  .banner .ico { margin-top: 2px; width: 18px; height: 18px; }
  .banner-ok { background: var(--ok-soft); color: var(--ok-ink); }
  .banner-err { background: var(--danger-soft); color: var(--danger-ink); }
  .banner-warn { background: var(--warn-soft); color: var(--warn-ink); }

  /* ---------- Detail surat ---------- */
  .detail-status { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .kv { margin: 0; }
  .kv-row { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .kv-row dt { color: var(--text-3); font-size: 13px; }
  .kv-row dd { margin: 0; overflow-wrap: anywhere; }
  .holder { display: inline-flex; align-items: center; gap: 6px; color: var(--brand-ink); }
  .attach { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; text-decoration: none; margin-bottom: 8px; }
  .attach:hover { text-decoration: underline; }
  .section-title { font: 600 15px var(--font-head); margin: 24px 0 12px; }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .tl-item { position: relative; padding: 0 0 18px 26px; }
  .tl-item::before { content: ''; position: absolute; left: 5px; top: 14px; bottom: -2px; width: 2px; background: var(--border); }
  .tl-item:last-child::before { display: none; }
  .tl-dot { position: absolute; left: 0; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border-strong); }
  .is-current .tl-dot { background: var(--brand); border-color: var(--brand); }
  .tl-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .tl-head time { font-size: 12.5px; color: var(--text-3); white-space: nowrap; }
  .tl-line { font-size: 13.5px; color: var(--text-2); margin-top: 3px; }
  .tl-line span { color: var(--text-3); margin-right: 6px; }
  .tl-status { margin-top: 8px; }

  /* ---------- Kosong, galat, memuat ---------- */
  .empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 44px 24px; color: var(--text-2); }
  .empty > .ico { width: 30px; height: 30px; color: var(--text-3); }
  .empty h3 { font: 600 15px var(--font-head); color: var(--text); }
  .empty p { max-width: 460px; }
  .empty .btn { margin-top: 8px; }
  .empty-err > .ico { color: var(--danger-ink); }
  .skel-wrap { display: flex; flex-direction: column; gap: 14px; }
  .skel-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .skel { background: linear-gradient(90deg, var(--surface-2), var(--border), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.3s infinite linear; border-radius: var(--r-sm); }
  .s-4 { height: 84px; border-radius: var(--r-md); }
  .s-block { height: 180px; border-radius: var(--r-md); }
  .s-line { height: 16px; }
  .s-line.short { width: 55%; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  /* ============================================================
   *  RESPONSIF
   *  - <= 1100px : grafik jadi satu kolom
   *  - <= 900px  : sidebar hilang, diganti navigasi bawah (tanpa hamburger)
   *  - <= 720px  : grid statistik 2 kolom, form 1 kolom, tabel jadi kartu
   *  Semua grid memakai minmax(0, 1fr) supaya isi yang panjang
   *  (teks nowrap, canvas, select) tidak mendorong lebar kolom.
   * ============================================================ */
  .bnav { display: none; }
  .more-list { display: flex; flex-direction: column; gap: 4px; margin: 14px 0 6px; }
  .more-item { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 8px 12px; background: transparent; border: 0; border-radius: var(--r-md); text-align: left; font-weight: 500; }
  .more-item:hover { background: var(--surface-2); }
  .more-item .ico { width: 20px; height: 20px; color: var(--brand); }
  .more-item small { display: block; font-weight: 400; font-size: 12.5px; color: var(--text-3); }

  @media (max-width: 1100px) {
    .q-item { grid-template-columns: minmax(0, 1fr) auto; }
    .q-holder { display: none; }
    .grid-2 { grid-template-columns: minmax(0, 1fr); }
  }

  @media (max-width: 900px) {
    .sidebar { display: none; }
    .topbar { padding: 10px 14px; flex-wrap: wrap; row-gap: 10px; }
    .topbar-left { flex: 1 1 0; min-width: 0; }
    .topbar-actions { display: none; }
    #pageSubtitle { display: none; }
    .search { order: 3; flex: 1 1 100%; max-width: none; margin-left: 0; }
    .kbd { display: none; }
    /* ruang untuk bottom bar supaya konten paling bawah tidak tertutup */
    .content { padding: 16px 14px calc(92px + env(safe-area-inset-bottom, 0px)); }

    .bnav {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; width: 100%; max-width: 100vw;
      min-height: calc(60px + env(safe-area-inset-bottom, 0px)); padding: 0 4px env(safe-area-inset-bottom, 0px);
      background: var(--surface); border-top: 1px solid var(--border);
    }
    .bnav-item {
      position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; padding: 6px 2px; background: transparent; border: 0; font-size: 12px; line-height: 1.2; color: var(--text-3);
    }
    .bnav-item > span[data-ico] { display: grid; }
    .bnav-item .ico { width: 22px; height: 22px; }
    .bnav-item .lbl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bnav-item.active { color: var(--brand-ink); font-weight: 600; }
    .bnav-item.active::before { content: ''; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--brand); }
    .bnav-badge {
      position: absolute; top: 3px; left: calc(50% + 4px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
      background: var(--danger); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums;
    }

    .toasts { right: 14px; left: 14px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); width: auto; }
    .overlay-center { align-items: flex-end; padding: 0; }
    .dialog { width: 100%; border-radius: var(--r-lg) var(--r-lg) 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); animation: sheet-up 0.2s ease-out; }
    .dialog-wide { max-height: 94vh; }
    .sheet { width: 100%; }
    .sheet-head { padding: 14px 12px 12px 16px; }
    .sheet-body { padding: 16px; }
    .sheet-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
    .sheet-foot .btn, .dialog-foot .btn { flex: 1 1 auto; }
    @keyframes sheet-up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  }

  @media (max-width: 720px) {
    /* grid statistik: 2 kolom, kartu pertama (Perlu tindakan) selebar layar */
    .kpi-grid, .kpi-grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .kpi-grid > .kpi-brand { grid-column: 1 / -1; }
    .kpi-grid-3 > .kpi:last-child { grid-column: 1 / -1; }
    .kpi { padding: 14px; }
    .kpi-value { font-size: 26px; }
    .kpi-label { overflow-wrap: anywhere; }

    .field-row, .checks { grid-template-columns: minmax(0, 1fr); }
    .kv-row { grid-template-columns: minmax(0, 1fr); gap: 2px; }
    .toolbar-l { width: 100%; }
    .toolbar-l > select { flex: 1 1 0; min-width: 0; }
    .filter-box { flex: 1 1 100%; width: 100%; }
    .filter-box input { width: 100%; }
    .toolbar > .btn { width: 100%; }
    .skel-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card:not(.card-flush) { padding: 16px; }
    .card-head { padding: 14px 16px 10px; }
    .chart-box { height: 220px; }

    /* kolom input 16px agar iOS tidak zoom otomatis, area sentuh minimal 44px */
    .field input[type="text"], .field input[type="email"], .field input[type="date"], .field select, .field textarea,
    .select-sm, .filter-box input, .search input { font-size: 16px; min-height: 44px; }
    .btn { min-height: 44px; }
    .btn-sm { min-height: 40px; }
    .btn-icon { width: 44px; height: 44px; }
    .check { min-height: 44px; }
    .preview-frame { height: 62vh; }

    /* tabel menjadi kartu */
    .tbl, .tbl tbody, .tbl tr, .tbl td { display: block; width: 100%; }
    .tbl thead { display: none; }
    .tbl tr { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .tbl tbody tr:last-child { border-bottom: 0; }
    .tbl td { display: flex; justify-content: space-between; gap: 14px; padding: 5px 0; border: 0; text-align: right; min-width: 0; overflow-wrap: anywhere; }
    .tbl td::before { content: attr(data-label); flex: 0 0 34%; text-align: left; font-size: 12.5px; color: var(--text-3); }
    .tbl td[data-label=""]::before { display: none; }
    .tbl td.cell-main { display: block; text-align: left; min-width: 0; max-width: none; padding-bottom: 8px; }
    .tbl td.cell-main::before { display: none; }
    .tbl td.cell-actions { justify-content: flex-start; flex-wrap: wrap; padding-top: 10px; }
    .tbl td.cell-actions > * + * { margin-left: 0; }
    .tbl td > .sub { text-align: right; }
    .q-item { grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 12px 16px; }
    .q-age { justify-content: flex-start; }
    .q-main .link-title { white-space: normal; }
  }
  /* ---------- Disposisi sebelumnya & pilihan Selesai pada form ---------- */
  .prev-box { margin: 0 0 14px; padding: 10px 12px; background: var(--info-soft); color: var(--info-ink); border-radius: var(--r-sm); font-size: 13.5px; }
  .prev-title { font-weight: 600; margin-bottom: 4px; }
  .prev-notes { margin: 6px 0 0 18px; }
  .prev-notes li { margin-top: 2px; overflow-wrap: anywhere; }
  .check-selesai { grid-column: 1 / -1; background: var(--brand-soft); border-radius: var(--r-sm); padding: 0 8px; margin-bottom: 4px; }
  .check input:disabled + span { opacity: 0.5; }
  .field > label small { font-weight: 400; color: var(--text-3); margin-left: 6px; }

  /* ---------- Penanda baris yang baru berubah ---------- */
  @keyframes flash-row { from { background: var(--brand-soft); } to { background: transparent; } }
  .row-flash td, .row-flash.q-item { animation: flash-row 1.6s ease-out; }

  /* ---------- Paginasi daftar surat ---------- */
  .tabs { scroll-margin-top: 84px; }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; padding: 12px 16px; border-top: 1px solid var(--border); }
  .pager-info { font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .pager-ctl { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .pager-size { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-3); }
  .pager-size .select-sm { height: 32px; padding: 0 28px 0 10px; font-size: 13px; }
  .pg { min-width: 34px; height: 34px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: var(--r-sm); color: var(--text-2); font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .pg:hover:not(:disabled):not(.on) { background: var(--surface-2); color: var(--text); }
  .pg.on { background: var(--brand-soft); color: var(--brand-ink); font-weight: 600; }
  .pg:disabled { opacity: 0.45; cursor: not-allowed; }
  .pg-gap { padding: 0 4px; color: var(--text-3); }
  @media (max-width: 900px) { .tabs { scroll-margin-top: 130px; } }
  @media (max-width: 720px) {
    .pager { flex-direction: column; align-items: stretch; padding: 12px 14px; }
    .pager-info { text-align: center; }
    .pager-ctl { justify-content: center; flex-wrap: nowrap; }
    .pager-ctl .pg { flex: 1 1 0; height: 44px; }
    .pager-ctl .pg-num:not(.on), .pager-ctl .pg-gap { display: none; }
    .pager-ctl .pg-num.on { flex: 0 0 auto; min-width: 52px; }
    .pager-size { justify-content: center; }
    .pager-size .select-sm { min-height: 40px; font-size: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
    .skel { animation: none; }
  }
</style>

(function () {

    download: '<path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/>',
    external: '<path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
    cloud: '<path d="M6 19a4 4 0 0 1-.5-8 6 6 0 0 1 11.6-1.5A4.5 4.5 0 0 1 17.5 19z"/>',
    message: '<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/>',
    checkc: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
