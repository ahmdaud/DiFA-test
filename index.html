      (rows.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Jabatan</th><th>Kode</th><th>Nama pejabat</th><th>Email</th><th>WhatsApp</th><th><span class="sr-only">Aksi</span></th></tr></thead><tbody>' +
        rows.map(r => '<tr><td data-label="Jabatan" class="cell-main"><b>' + esc(r['Jabatan'] || '-') + '</b></td><td data-label="Kode"><span class="mono">' + esc(r['Kode'] || '-') + '</span></td><td data-label="Nama">' + (r['Nama Pejabat'] ? esc(r['Nama Pejabat']) : '-') + '</td>' +
          '<td data-label="Email">' + (r['Email'] ? esc(r['Email']) : belumDiisi) + '</td><td data-label="WhatsApp">' + (r['No. WhatsApp'] ? esc(r['No. WhatsApp']) : belumDiisi) + '</td>' +
          '<td data-label="" class="cell-actions">' +
          '<button type="button" class="btn-icon" data-act="edit-pejabat" data-key="' + esc(r['Jabatan']) + '" aria-label="Edit ' + esc(r['Jabatan']) + '" title="Edit">' + ico('pencil') + '</button>' +
          '<button type="button" class="btn-icon btn-icon-danger" data-act="del-pejabat" data-key="' + esc(r['Jabatan']) + '" aria-label="Hapus ' + esc(r['Jabatan']) + '" title="Hapus">' + ico('trash') + '</button></td></tr>').join('') + '</tbody></table></div>'
        : emptyState('user', 'Belum ada jabatan', 'Tambahkan jabatan agar bisa dipilih di form surat.', '')) + '</section>';
  }

  function openPejabatForm(key) {
    const edit = key != null;
    const d = edit ? (S.master.pejabat.find(p => p['Jabatan'] === key) || {}) : {};
    const body =
      '<form id="formPejabat" data-submit="save-pejabat" data-orig="' + (edit ? esc(key) : '') + '" novalidate>' +
      '<div class="field" data-field="jabatan"><label for="m_jabatan">Nama jabatan</label><input type="text" id="m_jabatan" value="' + esc(d['Jabatan'] || '') + '" placeholder="mis. Ketua Pengadilan"' + (edit ? ' disabled' : ' data-autofocus') + '><div class="err" role="alert"></div></div>' +
      '<div class="field-row"><div class="field"><label for="m_kode">Kode penandatangan</label><input type="text" id="m_kode" value="' + esc(d['Kode'] || '') + '" placeholder="mis. KPA, SEK.01"></div>' +
      '<div class="field"><label for="m_nama">Nama pejabat</label><input type="text" id="m_nama" value="' + esc(d['Nama Pejabat'] || '') + '" placeholder="Opsional"></div></div>' +
      '<div class="field"><label for="m_email">Email</label><input type="email" id="m_email" value="' + esc(d['Email'] || '') + '" placeholder="nama@pengadilan.go.id"></div>' +
      '<div class="field"><label for="m_wa">No. WhatsApp</label><input type="text" id="m_wa" value="' + esc(d['No. WhatsApp'] || '') + '" placeholder="mis. 081234567890"><div class="hint">Untuk notifikasi disposisi lewat WhatsApp. Boleh diawali 08, +62, atau 62.</div></div>' +
      (edit ? '<p class="hint">Nama jabatan dipakai sebagai kunci data, jadi tidak bisa diubah. Hapus lalu tambah baru jika namanya perlu diganti.</p>' : '') +
      '</form>';
    openSheet({ kind: 'form', title: edit ? 'Edit jabatan' : 'Tambah jabatan', body: body,
      foot: '<button type="button" class="btn btn-ghost" data-act="close-sheet">Batal</button><button type="submit" form="formPejabat" class="btn btn-primary" id="btnSavePejabat">Simpan</button>' });
  }

  async function savePejabat(form) {
    clearErrs(form);
    const v = id => (($('#' + id) || {}).value || '');
    const orig = form.dataset.orig;
    const payload = { jabatan: orig || v('m_jabatan').trim(), kode: v('m_kode').trim(), namaPejabat: v('m_nama').trim(), email: v('m_email').trim(), noWhatsapp: v('m_wa').trim() };
    if (!payload.jabatan) { const c = fieldErr('jabatan', 'Isi nama jabatan.'); if (c) c.focus(); return; }
    const btn = $('#btnSavePejabat');
    setBusy(btn, true, 'Menyimpan…');
    try {
      const res = orig ? await gs('updatePejabat', orig, payload) : await gs('tambahPejabat', payload);
      if (res.success) { invalidateMasterClientCache('pejabat'); closeSheet(); toast(orig ? 'Jabatan diperbarui.' : 'Jabatan ditambahkan.', { type: 'ok' }); await reloadMaster(); }
      else { setBusy(btn, false); toast(res.message || 'Jabatan belum bisa disimpan.', { type: 'err' }); }
    } catch (e) { setBusy(btn, false); toast('Jabatan belum bisa disimpan: ' + errMsg(e), { type: 'err' }); }
  }

  async function hapusPejabatAksi(jabatan) {
    const ok = await confirmDialog({
      title: 'Hapus jabatan "' + jabatan + '"?',
      message: 'Surat lama yang memakai jabatan ini tidak terpengaruh, tetapi jabatan tidak akan muncul lagi di pilihan form baru.',
      confirmLabel: 'Hapus jabatan', danger: true
    });
    if (!ok) return;
    try {
      const res = await gs('hapusPejabat', jabatan);
      if (res.success) { invalidateMasterClientCache('pejabat'); toast('Jabatan dihapus.', { type: 'ok' }); await reloadMaster(); }
      else toast(res.message || 'Jabatan belum bisa dihapus.', { type: 'err' });
    } catch (e) { toast('Jabatan belum bisa dihapus: ' + errMsg(e), { type: 'err' }); }
  }

  function renderKlasifikasiTable() {
    const rows = S.master.klasifikasi;
    $('#masterContent').innerHTML =
      '<section class="card card-flush"><div class="card-head"><div><h2 class="card-title">Klasifikasi arsip</h2><p class="sub">' + rows.length + ' kode klasifikasi terdaftar.</p></div>' +
      '<button type="button" class="btn btn-primary" data-act="add-klasifikasi">' + ico('plus') + 'Tambah klasifikasi</button></div>' +
      (rows.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Kode</th><th>Nama / subjek</th><th>Keterangan</th><th><span class="sr-only">Aksi</span></th></tr></thead><tbody>' +
        rows.map(r => '<tr><td data-label="Kode"><span class="mono strong">' + esc(r['Kode Klasifikasi'] || '-') + '</span></td><td data-label="Nama" class="cell-main">' + esc(r['Nama Klasifikasi / Subjek'] || '-') + '</td><td data-label="Keterangan">' + esc(r['Keterangan / Uraian'] || '-') + '</td>' +
          '<td data-label="" class="cell-actions">' +
          '<button type="button" class="btn-icon" data-act="edit-klasifikasi" data-key="' + esc(r['Kode Klasifikasi']) + '" aria-label="Edit ' + esc(r['Kode Klasifikasi']) + '" title="Edit">' + ico('pencil') + '</button>' +
          '<button type="button" class="btn-icon btn-icon-danger" data-act="del-klasifikasi" data-key="' + esc(r['Kode Klasifikasi']) + '" aria-label="Hapus ' + esc(r['Kode Klasifikasi']) + '" title="Hapus">' + ico('trash') + '</button></td></tr>').join('') + '</tbody></table></div>'
        : emptyState('tag', 'Belum ada klasifikasi', 'Tambahkan kode klasifikasi agar bisa dipilih di form surat.', '')) + '</section>';
  }

  function openKlasifikasiForm(key) {
    const edit = key != null;
    const d = edit ? (S.master.klasifikasi.find(k => k['Kode Klasifikasi'] === key) || {}) : {};
    const body =
      '<form id="formKlasifikasi" data-submit="save-klasifikasi" data-orig="' + (edit ? esc(key) : '') + '" novalidate>' +
      '<div class="field-row"><div class="field" data-field="kode"><label for="mk_kode">Kode klasifikasi</label><input type="text" id="mk_kode" value="' + esc(d['Kode Klasifikasi'] || '') + '" placeholder="mis. TI.01"' + (edit ? ' disabled' : ' data-autofocus') + '><div class="err" role="alert"></div></div>' +
      '<div class="field"><label for="mk_nama">Nama / subjek</label><input type="text" id="mk_nama" value="' + esc(d['Nama Klasifikasi / Subjek'] || '') + '" placeholder="mis. Jaringan"></div></div>' +
      '<div class="field"><label for="mk_ket">Keterangan / uraian</label><textarea id="mk_ket" rows="3" placeholder="Opsional">' + esc(d['Keterangan / Uraian'] || '') + '</textarea></div>' +
      (edit ? '<p class="hint">Kode klasifikasi dipakai sebagai kunci data, jadi tidak bisa diubah. Hapus lalu tambah baru jika kodenya perlu diganti.</p>' : '') +
      '</form>';
    openSheet({ kind: 'form', title: edit ? 'Edit klasifikasi' : 'Tambah klasifikasi', body: body,
      foot: '<button type="button" class="btn btn-ghost" data-act="close-sheet">Batal</button><button type="submit" form="formKlasifikasi" class="btn btn-primary" id="btnSaveKlas">Simpan</button>' });
  }

  async function saveKlasifikasi(form) {
    clearErrs(form);
    const v = id => (($('#' + id) || {}).value || '');
    const orig = form.dataset.orig;
    const payload = { kode: orig || v('mk_kode').trim(), nama: v('mk_nama').trim(), keterangan: v('mk_ket').trim() };
    if (!payload.kode) { const c = fieldErr('kode', 'Isi kode klasifikasi.'); if (c) c.focus(); return; }
    const btn = $('#btnSaveKlas');
    setBusy(btn, true, 'Menyimpan…');
    try {
      const res = orig ? await gs('updateKlasifikasi', orig, payload) : await gs('tambahKlasifikasi', payload);
      if (res.success) { invalidateMasterClientCache('klasifikasi'); closeSheet(); toast(orig ? 'Klasifikasi diperbarui.' : 'Klasifikasi ditambahkan.', { type: 'ok' }); await reloadMaster(); }
      else { setBusy(btn, false); toast(res.message || 'Klasifikasi belum bisa disimpan.', { type: 'err' }); }
    } catch (e) { setBusy(btn, false); toast('Klasifikasi belum bisa disimpan: ' + errMsg(e), { type: 'err' }); }
  }

  async function hapusKlasifikasiAksi(kode) {
    const ok = await confirmDialog({ title: 'Hapus klasifikasi "' + kode + '"?', message: 'Kode ini tidak akan muncul lagi di pilihan form baru. Surat lama tidak terpengaruh.', confirmLabel: 'Hapus klasifikasi', danger: true });
    if (!ok) return;
    try {
      const res = await gs('hapusKlasifikasi', kode);
      if (res.success) { invalidateMasterClientCache('klasifikasi'); toast('Klasifikasi dihapus.', { type: 'ok' }); await reloadMaster(); }
      else toast(res.message || 'Klasifikasi belum bisa dihapus.', { type: 'err' });
    } catch (e) { toast('Klasifikasi belum bisa dihapus: ' + errMsg(e), { type: 'err' }); }
  }

  function renderUjiCobaWhatsApp() {
    $('#masterContent').innerHTML =
      '<section class="card card-narrow"><h2 class="card-title">Uji coba WhatsApp (Fonnte)</h2><p class="sub">Kirim satu pesan percobaan untuk memastikan integrasi WhatsApp tersambung.</p>' +
      '<form id="formWa" data-submit="kirim-wa" novalidate>' +
      '<div class="field" data-field="nomor"><label for="wa_nomor">Nomor WhatsApp tujuan</label><input type="text" id="wa_nomor" placeholder="mis. 081234567890" inputmode="tel"><div class="hint">Boleh diawali 08, +62, atau 62. Akan dirapikan otomatis.</div><div class="err" role="alert"></div></div>' +
      '<div class="field"><label for="wa_pesan">Isi pesan</label><textarea id="wa_pesan" rows="4" placeholder="Kosongkan untuk memakai pesan uji coba bawaan"></textarea></div>' +
      '<button type="submit" class="btn btn-primary" id="btnUjiWa">' + ico('message') + 'Kirim uji coba</button></form>' +
      '<div id="waHasil" aria-live="polite"></div></section>';
  }

  async function kirimUjiCobaWa(form) {
    clearErrs(form);
    const nomor = (($('#wa_nomor') || {}).value || '').trim(), pesan = ($('#wa_pesan') || {}).value || '';
    const out = $('#waHasil');
    if (!nomor) { const c = fieldErr('nomor', 'Isi nomor WhatsApp tujuan.'); if (c) c.focus(); return; }
    const btn = $('#btnUjiWa');
    setBusy(btn, true, 'Mengirim…');
    out.innerHTML = '';
    try {
      const res = await gs('ujiCobaKirimWhatsApp', nomor, pesan);
      setBusy(btn, false);
      out.innerHTML = '<div class="banner ' + (res.success ? 'banner-ok' : 'banner-err') + '">' + ico(res.success ? 'checkc' : 'xc') + '<span>' + esc(res.message) + '</span></div>';
    } catch (e) {
      setBusy(btn, false);
      out.innerHTML = '<div class="banner banner-err">' + ico('xc') + '<span>' + esc('Gagal menghubungi server: ' + errMsg(e)) + '</span></div>';
    }
  }

  /* ============================================================
   *  PENGHUBUNG EVENT (tanpa onclick inline)
   * ============================================================ */
  const ACTIONS = {
    'nav': el => navigateTo(el.dataset.page),
    'goto': el => {
      const p = el.dataset.page, t = el.dataset.tab;
      if (p === 'masuk' && t) { S.masuk.tab = t; S.masuk.page = 1; }
      if (p === 'keluar' && t) { S.keluar.tab = t; S.keluar.page = 1; }
      navigateTo(p);
    },
    'toggle-theme': () => toggleTheme(),
    'bnav': el => {
      const k = el.dataset.bnav;
      if (k === 'lainnya') { openMoreMenu(); return; }
      if (k === 'masuk') { S.masuk.tab = 'semua'; S.masuk.page = 1; }
      if (k === 'disposisi') { S.masuk.tab = 'aktif'; S.masuk.page = 1; }
      navigateTo(k === 'disposisi' ? 'masuk' : k);
    },
    'nav-close': el => { closeDialog(false); navigateTo(el.dataset.page); },
    'theme-close': () => { closeDialog(false); toggleTheme(); },
    'add-masuk': () => { closeDialog(false); openMasukForm(); },
    'add-keluar': () => { closeDialog(false); openKeluarForm(); },
    'open-masuk': el => openMasukDrawer(REG.masuk[el.dataset.kode], el.dataset.mode),
    'open-keluar': el => openKeluarEdit(REG.keluar[el.dataset.nomor]),
    'cetak': el => openCetak(el.dataset.kode),
    'selesai': el => tandaiSelesai(el.dataset.kode),
    'lanjut-toggle': () => { const b = $('#lanjutBox'); if (b && !b.hidden) { b.hidden = true; } else showLanjut(); },
    'lanjut-cancel': () => { const b = $('#lanjutBox'); if (b) b.hidden = true; },
    'submit-lanjut': el => submitLanjut(el.dataset.kode),
    'tab-masuk': el => { S.masuk.tab = el.dataset.tab; S.masuk.page = 1; renderMasukList(); syncBnav(); },
    'tab-keluar': el => { S.keluar.tab = el.dataset.tab; S.keluar.page = 1; renderKeluarList(); },
    'page-go': el => {
      const kind = el.dataset.kind, st = S[kind];
      st.page = Number(el.dataset.page) || 1;
      if (kind === 'masuk') renderMasukList(); else renderKeluarList();
      keAwalDaftar(kind);
    },
    'tab-lap': el => { S.lap.tab = el.dataset.tab; renderLapTables(); },
    'tab-master': el => { S.master.tab = el.dataset.tab; renderMasterShell(); loadMasterTab().catch(showError); },
    'save-keluar': el => saveKeluar(el.dataset.mode),
    'save-keluar-edit': el => saveKeluarEdit(el.dataset.nomor, el.dataset.mode),
    'export': el => exportLaporan(el.dataset.type, el),
    'backup': el => jalankanBackup(el),
    'reset-arsip': el => jalankanResetManual(el),
    'add-pejabat': () => openPejabatForm(),
    'edit-pejabat': el => openPejabatForm(el.dataset.key),
    'del-pejabat': el => hapusPejabatAksi(el.dataset.key),
    'add-klasifikasi': () => openKlasifikasiForm(),
    'edit-klasifikasi': el => openKlasifikasiForm(el.dataset.key),
    'del-klasifikasi': el => hapusKlasifikasiAksi(el.dataset.key),
    'simpan-drive': el => simpanDrive(el.dataset.kode, el),
    'tab-baru': () => bukaTabBaru(),
    'cetak-frame': () => cetakFrame(),
    'search-pick': el => {
      const type = el.dataset.type, key = el.dataset.key;
      closeSearch(true);
      if (type === 'masuk') openMasukDrawer(REG.masuk[key]); else openKeluarEdit(REG.keluar[key]);
    },
    'toast-action': el => {
      const fn = S.toastActions[el.dataset.id];
      removeToast(el.closest('.toast'));
      if (fn) fn();
    },
    'toast-close': el => removeToast(el.closest('.toast')),
    'close-sheet': () => closeSheet(),
    'sheet-backdrop': (el, e) => { if (e.target === el) closeSheet(); },
    'dialog-backdrop': (el, e) => { if (e.target === el) closeDialog(false); },
    'dialog-yes': () => closeDialog(true),
    'dialog-no': () => closeDialog(false),
    'close-dialog': () => closeDialog(false),
    'retry': () => navigateTo(S.page, { soft: false })
  };

  const SUBMITS = {
    'save-masuk': () => saveMasuk(),
    'save-pejabat': f => savePejabat(f),
    'save-klasifikasi': f => saveKlasifikasi(f),
    'kirim-wa': f => kirimUjiCobaWa(f)
  };

  const CHANGES = {
    'year-masuk': el => { S.masuk.tahun = Number(el.value); S.masuk.page = 1; S.masuk.rows = []; S.masuk.fetchedAt = 0; $('#masukList').innerHTML = '<div class="pad">' + skeleton() + '</div>'; PAGES.masuk(S.nav).catch(showError); },
    'year-keluar': el => { S.keluar.tahun = Number(el.value); S.keluar.page = 1; S.keluar.rows = []; S.keluar.fetchedAt = 0; $('#keluarList').innerHTML = '<div class="pad">' + skeleton() + '</div>'; PAGES.keluar(S.nav).catch(showError); },
    'l-selesai': el => {
      const on = el.checked;
      $$('.l-target:not(.l-selesai)').forEach(c => { if (on) c.checked = false; c.disabled = on; });
      const opt = $('#l_petunjukOpsional'); if (opt) opt.hidden = !on;
      const btn = $('#btnLanjutkan'); if (btn) btn.textContent = on ? 'Tandai selesai' : 'Catat disposisi';
    },
    'page-size': el => {
      const z = Number(el.value);
      if (PAGE_SIZES.indexOf(z) < 0) return;
      S.masuk.size = z; S.keluar.size = z; S.masuk.page = 1; S.keluar.page = 1;
      store.set('pagesize', z);
      if (el.dataset.kind === 'masuk') renderMasukList(); else renderKeluarList();
      keAwalDaftar(el.dataset.kind);
    },
    'tujuan-change': () => onTujuanChange(),
    'keluar-preview': () => updateNomorPreview(),
    'lap-filter': debounce(() => applyLaporan(), 150)
  };

  const INPUTS = {
    'q-masuk': el => { S.masuk.q = el.value; S.masuk.page = 1; renderMasukList(); },
    'q-keluar': el => { S.keluar.q = el.value; S.keluar.page = 1; renderKeluarList(); },
    'global-search': debounce(el => runSearch(el.value), 200)
  };

  function bindEvents() {
    document.addEventListener('click', e => {
      const t = e.target;
      if (!t.closest('#searchWrap')) closeSearch(false);
      const el = t.closest('[data-act]');
      if (!el) return;
      const anchor = t.closest('a[href]');
      if (anchor && anchor !== el) return;     // tautan di dalam baris tetap berfungsi normal
      const fn = ACTIONS[el.dataset.act];
      if (fn) fn(el, e);
    });
    document.addEventListener('submit', e => {
      e.preventDefault();
      const f = e.target.closest('[data-submit]');
      if (f && SUBMITS[f.dataset.submit]) SUBMITS[f.dataset.submit](f, e);
    });
    document.addEventListener('change', e => {
      const el = e.target.closest('[data-change]');
      if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el, e);
    });
    document.addEventListener('input', e => {
      const el = e.target.closest('[data-input]');
      if (el && INPUTS[el.dataset.input]) INPUTS[el.dataset.input](el, e);
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if ($('#dialogRoot').firstElementChild) { closeDialog(false); return; }
        if (!$('#searchPop').hidden) { closeSearch(true); return; }
        if ($('#sheetRoot').firstElementChild) { closeSheet(); return; }
        return;
      }
      const tag = document.activeElement ? document.activeElement.tagName : '';
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tag);
      if (((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'k') || (e.key === '/' && !typing)) {
        e.preventDefault();
        $('#globalSearch').focus();
        return;
      }
      if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'globalSearch') {
        const first = $('#searchPop .sp-item');
        if (first) first.click();
      }
    });
    // Hover-intent: bila kursor berhenti 250 ms di sebuah surat, riwayatnya sudah diunduh saat panel dibuka.
    let hoverTimer = null;
    document.addEventListener('pointerover', e => {
      const el = e.target.closest('tr[data-kode], li[data-kode]');
      if (!el) return;
      clearTimeout(hoverTimer);
      hoverTimer = setTimeout(() => { getRiwayat(el.dataset.kode).catch(() => {}); }, 250);
    });
    document.addEventListener('pointerout', () => clearTimeout(hoverTimer));
    window.addEventListener('resize', fitLembarFrame);
    window.addEventListener('orientationchange', () => setTimeout(fitLembarFrame, 300));
  }

  function init() {
    $$('[data-ico]').forEach(el => { el.innerHTML = ico(el.dataset.ico); });
    initTheme();
    bindEvents();
    preloadMasterData();
    navigateTo(document.body.dataset.initial || 'dashboard');
    // Prefetch saat browser menganggur: daftar surat keluar siap sebelum menunya dibuka.
    setTimeout(() => {
      if (!S.keluar.fetchedAt) gs('getSuratKeluarList').then(r => { if (!S.keluar.fetchedAt) setKeluarData(r); }).catch(() => {});
    }, 2000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
